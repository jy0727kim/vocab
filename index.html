<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="회사 단어장">
<title>회사 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F2F5F6; --card:#FFFFFF; --ink:#14262B; --mute:#5B6E73; --line:#D3DDE0;
  --acc:#0E6B73; --acc-ink:#FFFFFF; --accbg:#E1F0F1;
  --ok:#1F7A46; --okbg:#E3F3EA; --bad:#B8400E; --badbg:#FBE9E0;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --serif:'Noto Serif KR','Batang','AppleMyungjo',Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0F1A1D; --card:#172529; --ink:#E6EEF0; --mute:#93A8AD; --line:#2B3E43;
    --acc:#4FB7BF; --acc-ink:#0A1C1F; --accbg:#183338;
    --ok:#5CC48A; --okbg:#173326; --bad:#F08A5A; --badbg:#3A2218;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F1A1D; --card:#172529; --ink:#E6EEF0; --mute:#93A8AD; --line:#2B3E43;
  --acc:#4FB7BF; --acc-ink:#0A1C1F; --accbg:#183338;
  --ok:#5CC48A; --okbg:#173326; --bad:#F08A5A; --badbg:#3A2218;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding-bottom:84px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px}
header h1{font-family:var(--serif);font-size:26px;margin:0;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap-r{flex-wrap:wrap}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{display:block;width:100%;min-height:130px;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.modes{display:flex;gap:8px;margin-top:14px}
.modes button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px;font-weight:500}
.modes button[aria-pressed="true"]{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.brow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.brow .bi{flex:1;min-width:0}
.brow .bw{font-family:var(--serif);font-weight:700;font-size:18px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:500}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.mute{color:var(--mute)}
.small{font-size:13px}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--badbg);color:var(--bad);font-size:14px}
.note{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accbg);color:var(--ink);font-size:14px}

/* 사전 항목 */
.entry .hw{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.entry .word{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.entry .ipa{color:var(--mute);font-size:15px}
.spk{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;padding:0;flex:none}
.spk svg{width:18px;height:18px;fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spk.sm{width:30px;height:30px}.spk.sm svg{width:15px;height:15px}
.sense{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.sense:first-of-type{margin-top:12px}
.pos{display:inline-block;font-size:12px;font-weight:600;color:var(--acc);background:var(--accbg);border-radius:6px;padding:1px 8px;margin-right:6px}
.ko{font-weight:600;font-size:16px}
.en{margin:4px 0 0;color:var(--ink)}
.ex{margin:8px 0 0;padding-left:12px;border-left:3px solid var(--line)}
.ex .e{display:flex;gap:6px;align-items:flex-start;font-style:italic}
.ex .k{color:var(--mute);font-size:14px;margin-top:2px}

/* 단어장 목록 */
.group{margin-top:22px}
.group h3{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--mute);display:flex;justify-content:space-between}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.item .top{display:flex;align-items:stretch}
.item .top>button.head{all:unset;box-sizing:border-box;display:flex;flex:1;min-width:0;gap:10px;align-items:center;padding:12px 6px 12px 14px;cursor:pointer}
.item .top>button.head:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.item .x{flex:none;min-width:48px;border:0;background:none;color:var(--mute);font-size:24px;line-height:1;padding:0 12px;cursor:pointer}
.item .x.armed{color:var(--bad);font-size:13px;font-weight:600;white-space:nowrap}
.item .iw{font-family:var(--serif);font-weight:700;font-size:18px}
.item .im{color:var(--mute);font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;background:var(--badbg);color:var(--bad);flex:none}
.item .detail{padding:0 14px 14px;border-top:1px solid var(--line)}
.item .detail .entry .sense:first-of-type{margin-top:6px;border-top:none;padding-top:0}
.danger{color:var(--bad);border-color:var(--bad)}
.edit label{display:block;margin-top:10px}
.edit input[type=text]{width:100%;margin-top:4px;font-size:15px;padding:9px 11px}

/* 퀴즈 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.seg{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;text-align:left}
.seg button[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg);box-shadow:inset 0 0 0 1px var(--acc)}
.seg b{display:block;font-size:14px}
.seg span{font-size:12px;color:var(--mute)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--acc)}
.q-word{font-family:var(--serif);font-size:34px;font-weight:700;margin:6px 0 0}
.q-ko{font-size:20px;font-weight:600;margin:6px 0}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;text-align:left;font-size:15px}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.verdict{margin-top:14px;padding:10px 12px;border-radius:10px;font-weight:600}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.no{background:var(--badbg);color:var(--bad)}
.score{display:flex;gap:10px;margin-top:12px}
.score div{flex:1;border-radius:12px;padding:12px;text-align:center}
.score .r{background:var(--okbg);color:var(--ok)}
.score .w{background:var(--badbg);color:var(--bad)}
.score b{display:block;font-size:30px;font-family:var(--serif);line-height:1.1}
.rl{list-style:none;margin:8px 0 0;padding:0}
.rl li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rl li b{font-family:var(--serif);min-width:90px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;border:0;background:none;padding:12px 0 10px;font-size:14px;color:var(--mute);font-weight:500}
nav.tabs button[aria-current="page"]{color:var(--acc);font-weight:600;box-shadow:inset 0 3px 0 var(--acc)}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.dots::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:d 1.2s steps(4,end) infinite}
@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@media (prefers-reduced-motion: reduce){.dots::after{animation:none;content:'…'}}

/* ===== 퀴즈: 우주 오페라 테마 (원작 이름과 로고는 쓰지 않은 오리지널 디자인) ===== */
body.space{
  color-scheme:dark;
  --bg:#05070F; --card:rgba(12,20,44,.82); --ink:#E8F0FF; --mute:#8EA2C9; --line:#243662;
  --acc:#4FD1FF; --acc-ink:#021018; --accbg:rgba(79,209,255,.13);
  --ok:#5CFFB0; --okbg:rgba(92,255,176,.12); --bad:#FF7A66; --badbg:rgba(255,107,90,.15);
  --gold:#FFD36B; --orb:'Orbitron','IBM Plex Sans KR',system-ui,sans-serif;
  background-color:#05070F;
  background-image:
    radial-gradient(1.2px 1.2px at 20px 30px,#fff,transparent),
    radial-gradient(1px 1px at 90px 120px,rgba(255,255,255,.8),transparent),
    radial-gradient(1.6px 1.6px at 160px 60px,#9fdcff,transparent),
    radial-gradient(1px 1px at 230px 200px,#fff,transparent),
    radial-gradient(1px 1px at 60px 220px,rgba(255,255,255,.7),transparent),
    radial-gradient(ellipse at 50% -10%,rgba(79,209,255,.20),transparent 60%),
    radial-gradient(ellipse at 100% 100%,rgba(140,90,255,.14),transparent 55%);
  background-size:260px 260px,260px 260px,260px 260px,260px 260px,260px 260px,100% 100%,100% 100%;
  background-attachment:fixed;
}
body.space header h1{font-family:var(--orb);font-size:20px;letter-spacing:.04em;text-shadow:0 0 14px rgba(79,209,255,.5)}
body.space header p{display:none}
body.space .card{border-color:rgba(79,209,255,.32);box-shadow:0 0 0 1px rgba(79,209,255,.05),0 8px 30px rgba(0,0,0,.35);backdrop-filter:blur(3px)}
body.space .card h2{font-family:var(--orb);font-size:13px;letter-spacing:.1em;color:var(--acc);font-weight:600}
body.space .btn{background:rgba(8,14,32,.7)}
body.space .btn.pri{background:linear-gradient(180deg,#6FDCFF,#2BA8E0);color:var(--acc-ink);border-color:#7FE3FF;font-weight:600;box-shadow:0 0 18px rgba(79,209,255,.4)}
body.space .btn.pri:disabled{box-shadow:none}
body.space nav.tabs{backdrop-filter:blur(6px)}
body.space .chip{background:rgba(8,14,32,.7)}
body.space .chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);box-shadow:0 0 14px rgba(79,209,255,.5)}
body.space .seg button{background:rgba(8,14,32,.7)}
body.space .seg button[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg);box-shadow:0 0 16px rgba(79,209,255,.3),inset 0 0 0 1px var(--acc)}
body.space .seg b{font-size:15px}
body.space input[type=text]{background:#060B1A;border-color:var(--line)}
body.space .note{background:var(--accbg)}
.hero{text-align:center;padding:10px 0 4px;perspective:500px}
.hero-t{font-family:var(--orb,'Orbitron',sans-serif);font-weight:800;font-size:30px;letter-spacing:.14em;color:var(--ink);transform:rotateX(16deg);text-shadow:0 0 22px rgba(79,209,255,.75),0 0 2px #fff}
.hero-s{margin-top:6px;color:var(--mute);font-size:14px}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hud .hi{font-family:var(--orb,'Orbitron',sans-serif);font-size:12px;letter-spacing:.08em;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:rgba(8,14,32,.6)}
.hud .hi b{font-size:16px;color:var(--ink);margin-left:4px}
.hud .hi.score b{color:var(--gold)}
.hud .hi.combo b{color:var(--ok);text-shadow:0 0 10px rgba(92,255,176,.7)}
.hud .sp{flex:1}
.cap{margin:14px 0 2px;font-size:13px;color:var(--acc);letter-spacing:.06em}
body.space .prog{height:9px;background:#0B1530;border:1px solid var(--line);border-radius:6px;margin:12px 0 4px}
body.space .prog i{border-radius:5px;background:linear-gradient(90deg,#2BA8E0,#9FF0FF 85%,#fff);box-shadow:0 0 12px 2px rgba(79,209,255,.7);transition:width .5s}
body.space .q-word{font-size:36px;text-shadow:0 0 18px rgba(79,209,255,.35)}
body.space .q-ko{font-size:21px}
body.space .opt{background:rgba(8,14,32,.7)}
body.space .opt:hover:not(:disabled){border-color:var(--acc);box-shadow:0 0 14px rgba(79,209,255,.35)}
body.space .opt.right{box-shadow:0 0 20px rgba(92,255,176,.45)}
body.space .opt.wrong{animation:shake .35s}
body.space .verdict{font-family:inherit;border:1px solid currentColor}
body.space .verdict .pts{float:right;font-family:var(--orb);color:var(--gold)}
body.space .spk{background:rgba(8,14,32,.7)}
.launch{margin-top:18px;padding:16px;font-family:var(--orb,'Orbitron',sans-serif);font-size:17px;letter-spacing:.14em}
.rank{text-align:center;padding:6px 0 2px}
.rank .rt{font-family:var(--orb,'Orbitron',sans-serif);font-weight:800;font-size:22px;letter-spacing:.1em;color:var(--gold);text-shadow:0 0 18px rgba(255,211,107,.6)}
.rank .rs{color:var(--mute);font-size:13px;margin-top:2px}
.rank .big{font-family:var(--orb,'Orbitron',sans-serif);font-weight:800;font-size:40px;color:var(--ink);margin:10px 0 2px;text-shadow:0 0 18px rgba(79,209,255,.6)}
.stats{display:flex;gap:8px;margin-top:12px}
.stats div{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 4px;background:rgba(8,14,32,.6);font-size:12px;color:var(--mute)}
.stats b{display:block;font-family:var(--orb,'Orbitron',sans-serif);font-size:18px;color:var(--ink)}
.warp{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden;animation:warpbg 1.1s ease-in forwards}
.warp::before{content:'';position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(170,225,255,.95) 0 .55deg,transparent .55deg 4.5deg);animation:warpzoom 1.1s cubic-bezier(.55,0,1,.55) forwards}
@keyframes warpzoom{from{transform:scale(.08);opacity:0}25%{opacity:1}to{transform:scale(3.2);opacity:1}}
@keyframes warpbg{0%{background:rgba(0,0,0,0)}20%{background:rgba(0,2,10,.92)}80%{background:rgba(0,2,10,.92)}92%{background:rgba(190,235,255,.85)}100%{background:rgba(190,235,255,0);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.warp{display:none}body.space .opt.wrong{animation:none}body.space .prog i{transition:none}}

/* ===== 사전 화면: 품사 묶음 + 번호 + 예문(듣기/반복) ===== */
.posh{color:var(--acc);font-size:14px;font-weight:600;margin:18px 0 4px}
.sn{display:flex;gap:8px;margin-top:12px}
.sn .no{flex:none;min-width:1.5em;font-weight:600;color:var(--mute)}
.sn .sb{flex:1;min-width:0}
.smain{font-size:16px;font-weight:600;line-height:1.5}
.sdef{margin-top:2px;color:var(--mute);font-size:13px}
.ex2{margin-top:10px;padding-left:12px;border-left:3px solid var(--line)}
.ex2 .e{font-size:15px}
.ex2 .k{color:var(--mute);font-size:14px;margin-top:2px}
.pill{display:inline-flex;margin:8px 0 4px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.pill button{border:0;background:none;padding:6px 14px;display:grid;place-items:center;cursor:pointer}
.pill button+button{border-left:1px solid var(--line)}
.pill svg{width:18px;height:18px;fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill button.on{background:var(--accbg)}
.pill button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
/* ===== 퀴즈 배경 캐릭터 (오리지널 우주선과 로봇) ===== */
#decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
body.space #decor{display:block}
.wrap{position:relative;z-index:1}
.planet{position:absolute;top:-70px;right:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#b794ff,#5b3fd0 55%,#1c1450);box-shadow:0 0 50px rgba(140,90,255,.35);opacity:.8}
.planet::after{content:'';position:absolute;left:-30%;right:-30%;top:46%;height:22%;border-radius:50%;border:3px solid rgba(255,211,107,.55);transform:rotate(-14deg)}
.ship{position:absolute;top:13%;left:0;width:96px;animation:fly 38s linear infinite}
.ship svg{width:100%;height:auto;display:block}
.flame{transform-box:fill-box;transform-origin:100% 50%;animation:flick .18s steps(2) infinite}
.drone{position:absolute;left:3%;top:48%;width:110px;opacity:.4;animation:bob 7s ease-in-out infinite}
.drone svg{width:100%;height:auto;display:block}
.bot{display:inline-block;vertical-align:middle;flex:none;line-height:0}
.bot svg{width:40px;height:40px}
.bot.happy{animation:hop .5s}
.bot.sad{animation:shake .4s}
.herobot{display:grid;place-items:center;margin-bottom:2px}
.herobot svg{width:64px;height:64px}
@keyframes fly{from{transform:translateX(-140px) rotate(-5deg)}to{transform:translateX(calc(100vw + 40px)) rotate(4deg)}}
@keyframes bob{0%,100%{transform:translateY(-12px) rotate(-3deg)}50%{transform:translateY(12px) rotate(3deg)}}
@keyframes flick{from{transform:scaleX(1)}to{transform:scaleX(.7)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
@media (prefers-reduced-motion: reduce){.ship,.drone,.flame,.bot.happy,.bot.sad{animation:none}.ship{left:68%}}

.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;margin:-16px -16px 0;padding:10px 16px 6px;background:rgba(6,11,26,.95);border-radius:12px 12px 0 0;border-bottom:1px solid var(--line)}
.stick .prog{margin:8px 0 2px}
.nextb{font-family:var(--orb,'Orbitron',sans-serif);letter-spacing:.06em;padding:8px 14px}
.secret{-webkit-text-security:disc}

/* ===== 아이가 만든 이모티콘 ===== */
.stk{display:block;height:auto;max-width:100%;user-select:none;-webkit-user-drag:none}
.stk.hop{animation:hop .6s}
.stk.shake{animation:shake .45s}
.herobot img.stk{margin:0 auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.empty img.stk{margin:0 auto 6px}
.addhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.addhead h2{margin:0}
.vrow{display:flex;gap:10px;align-items:center;margin-top:14px}
.vrow .verdict{flex:1;margin-top:0}
.warpstk{position:fixed;z-index:31;left:0;top:36%;pointer-events:none;animation:zoomby 1.1s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes zoomby{from{transform:translateX(-170px) rotate(-8deg)}to{transform:translateX(calc(100vw + 60px)) rotate(8deg)}}
#pals{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;align-items:flex-end;pointer-events:none;z-index:0;padding:0 8px}

<body>
<div id="decor" aria-hidden="true"></div>
<div id="pals" aria-hidden="true"></div>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script>
(function () {
  'use strict';

  /* ---------- 작은 도구들 ---------- */
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmtDate(s) {
    var d = new Date(s + 'T00:00:00');
    if (isNaN(d)) return s;
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + '일월화수목금토'[d.getDay()] + ')';
  }
  var TAGS = ['영어', '국어', '업무'];
  var TAG_DESC = { '영어': '일상·학교 영어를 아이 눈높이의 쉬운 뜻과 예문으로 정리해요', '국어': '한글 단어는 국립국어원 사전으로 찾아요', '업무': '업무 용어 중심으로 정리해요' };
  function normTag(t) { return t === '영어책' ? '영어' : t === '국어책' ? '국어' : t; }
  function tagOf(w) {                       // 분류가 없으면 영어 (한글 단어는 국어)
    var t = w && normTag(w.tag);
    if (t) return t;
    return langOf(w) === 'ko' ? '국어' : '영어';
  }
  function quizWords() { return S.words.filter(function (w) { return !S.quiz.tag || tagOf(w) === S.quiz.tag; }); }
  function tagChips() {
    return '<div class="tagrow"><div class="chips">' + TAGS.map(function (t) {
      return '<button class="chip" data-act="tag" data-t="' + t + '" aria-pressed="' + (S.tag === t) + '">' + t + '</button>';
    }).join('') + '</div><div class="mute small" style="margin-top:4px">' + esc(TAG_DESC[S.tag] || '') + '</div></div>';
  }
  function langOf(w) { return w && w.lang === 'ko' ? 'ko' : 'en'; }
  function ttsLang(w) { return langOf(w) === 'ko' ? 'ko-KR' : ''; }
  function wordId(w) {
    var s = String(w).toLowerCase().replace(/[^a-z0-9가-힣]+/g, '-').replace(/^-|-$/g, '');
    return s || ('w' + Date.now());
  }
  var ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  var HANGUL = /[가-힣]/;

  /* ---------- 상태 ---------- */
  var S = {
    tab: 'add', words: [], q: '', loading: false, found: null, foundKo: '',
    msg: '', note: '', addMode: 'one', bulkText: '',
    bulk: { loading: false, prog: '', results: [], bad: [], skipped: 0 },
    open: {}, delArm: null, edit: null, krKey: '', krBase: '', foundEn: '', oxId: '', oxKey: '', oxBase: '', gemKey: '', gemModel: '', purpose: '', gemQuality: false, selfRes: [], selfBusy: false, gemResult: '', gemDiag: '', gemUsed: '', photoUrl: '', photoBusy: false, photoMode: 'auto', tag: '영어', listTag: '', curTag: '', focusQ: false, order: ['gemini', 'oxford', 'free', 'wikt'], off: {}, email: '', storageOK: true,
    quiz: { dates: {}, onlyWrong: false, mode: 'mc', run: null, tag: '' }
  };

  /* ---------- 저장 (이 기기의 브라우저에 저장) ---------- */
  var LS_KEY = 'companyWords:v2';
  var LS_MAIL = 'companyWords:mail';
  var LS_KRKEY = 'companyWords:krkey';
  // 한국어기초사전 인증키 기본값 (개인용). 비워두려면 '' 로 바꾸세요. 설정 화면에서 입력한 키가 있으면 그게 우선이에요.
  var KR_KEY_BUILTIN = '901BC99ADF6F3680EA3E6D28F97C6E68';
  var LS_KRBASE = 'companyWords:krbase';
  var APP_VERSION = 'v17 · Gemini 전용';
  var LS_TAG = 'companyWords:tag';
  var LS_GEMKEY = 'companyWords:gemkey', LS_GEMMODEL = 'companyWords:gemmodel', LS_PURPOSE = 'companyWords:purpose', LS_ORDER = 'companyWords:order';
  var LS_OXID = 'companyWords:oxid', LS_OXKEY = 'companyWords:oxkey', LS_OXBASE = 'companyWords:oxbase';
  function krMeaning(senses) {
    return (senses || []).slice(0, 2).map(function (s) {
      var d = String(s.koDef || '').trim().replace(/[.\s]+$/, '');
      return d.length > 50 ? d.slice(0, 48) + '…' : d;
    }).filter(Boolean).join(' / ');
  }
  function migrate(arr) {
    (arr || []).forEach(function (w) {
      if (w && w.tag) w.tag = normTag(w.tag);
      if (w && w.lang === 'ko' && w.enm === undefined) {
        if (w.ko && !/[가-힣]/.test(w.ko)) { w.enm = w.ko; w.ko = krMeaning(w.senses); }
        else w.enm = '';
      }
    });
    return arr;
  }
  function lsLoad() {
    try { return migrate(JSON.parse(localStorage.getItem(LS_KEY) || '[]')); } catch (e) { S.storageOK = false; return []; }
  }
  function lsSave() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(S.words)); } catch (e) { S.storageOK = false; }
  }
  function putWord(w, silent) {
    var i = S.words.findIndex(function (x) { return x.id === w.id; });
    if (i >= 0) S.words[i] = w; else S.words.push(w);
    lsSave();
    if (!silent) render();
  }
  function delWord(id) {
    S.words = S.words.filter(function (x) { return x.id !== id; });
    lsSave(); render();
  }

  /* ---------- 발음 ---------- */
  var canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  function speak(text, lang) {
    if (!canSpeak || !text) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var L = lang || 'en-US';
      u.lang = L; u.rate = 0.9;
      var re = new RegExp('^' + L.slice(0, 2) + '[-_]' + L.slice(3) + '$', 'i');
      var v = speechSynthesis.getVoices().find(function (x) { return re.test(x.lang); });
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) { /* 소리가 안 나도 앱은 계속 */ }
  }
  if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }
  var loopKey = null;
  function stopLoop() {
    loopKey = null;
    try { if (canSpeak) speechSynthesis.cancel(); } catch (e) {}
    var on = document.querySelectorAll('.pill .on');
    for (var i = 0; i < on.length; i++) on[i].classList.remove('on');
  }
  function toggleLoop(text, lang, btn) {
    if (!canSpeak || !text) return;
    if (loopKey === text) { stopLoop(); return; }
    stopLoop();
    loopKey = text;
    if (btn) btn.classList.add('on');
    var count = 0, L = lang || 'en-US';
    var re = new RegExp('^' + L.slice(0, 2) + '[-_]' + L.slice(3) + '$', 'i');
    (function again() {
      if (loopKey !== text) return;
      if (count >= 20) { stopLoop(); return; }
      count++;
      try {
        var u = new SpeechSynthesisUtterance(text);
        u.lang = L; u.rate = 0.9;
        var v = speechSynthesis.getVoices().find(function (x) { return re.test(x.lang); });
        if (v) u.voice = v;
        u.onend = function () { setTimeout(again, 350); };
        u.onerror = function () { if (loopKey === text) stopLoop(); };
        speechSynthesis.speak(u);
      } catch (e) { stopLoop(); }
    })();
  }
  function playWord(text, audio, lang) {
    if (audio) {
      try {
        var a = new Audio(audio);
        a.play().catch(function () { speak(text, lang); });
        return;
      } catch (e) { /* 아래 기본값 */ }
    }
    speak(text, lang);
  }
  function spkBtn(text, small, audio, lang) {
    return '<button class="spk' + (small ? ' sm' : '') + '" data-act="speak" data-t="' + esc(text) + '" data-a="' + esc(audio || '') + '" data-l="' + esc(lang || '') +
      '" aria-label="발음 듣기">' + ICON + '</button>';
  }

  /* ---------- 무료 API 호출 ---------- */
  var DICT = 'https://api.dictionaryapi.dev/api/v2/entries/en/';
  var WIKT = 'https://en.wiktionary.org/api/rest_v1/page/definition/';
  var MM = 'https://api.mymemory.translated.net/get?langpair=en%7Cko&q=';

  async function fetchJson(url, ms, headers) {
    var ctl = new AbortController();
    var t = setTimeout(function () { ctl.abort(); }, ms || 12000);
    try {
      var r = await fetch(url, headers ? { signal: ctl.signal, headers: headers } : { signal: ctl.signal });
      var data = null;
      try { data = await r.json(); } catch (e) { /* JSON이 아니어도 status는 쓴다 */ }
      return { status: r.status, data: data };
    } finally { clearTimeout(t); }
  }

  var POS_KO = { noun: '명', verb: '동', adjective: '형', adverb: '부', preposition: '전', conjunction: '접', pronoun: '대', interjection: '감', abbreviation: '약' };

  function pickSenses(all, max) {
    var picks = [];
    function add(s) { if (s && picks.indexOf(s) < 0 && picks.length < (max || 3)) picks.push(s); }
    var seenPos = {};
    all.forEach(function (s) {          // 1) 품사마다 하나씩 (예문 있는 걸 우선)
      if (seenPos[s.pos]) return;
      seenPos[s.pos] = 1;
      add(all.find(function (x) { return x.pos === s.pos && x.ex; }) || s);
    });
    all.forEach(function (s) { if (s.ex) add(s); });   // 2) 예문 있는 뜻으로 채우기
    all.forEach(function (s) { add(s); });             // 3) 그래도 모자라면 나머지
    return picks;
  }

  function cleanEx(x) {
    x = String(x || '').trim();
    return /add an example for this sense|^\(?\s*can we add an example/i.test(x) ? '' : x;
  }
  function stripHtml(x) {
    try {
      return (new DOMParser().parseFromString(String(x || ''), 'text/html').body.textContent || '').replace(/\s+/g, ' ').trim();
    } catch (e) { return String(x || '').replace(/<[^>]*>/g, '').trim(); }
  }
  var WIKT_SKIP = /^(plural|third-person|present participle|simple past|past participle|alternative|obsolete|misspelling|inflection|comparative|superlative|archaic|eye dialect|nonstandard)\b|ISO 639|language code|given name|surname|^(a|the) (letter|character|symbol)\b/i;
  var SKIP_POS = ['symbol', 'letter', 'number', 'numeral', 'prefix', 'suffix', 'infix', 'interfix', 'circumfix', 'affix', 'punctuation mark', 'diacritical mark', 'character', 'han character', 'syllable', 'contraction'];
  var POS_RANK = { noun: 0, verb: 1, adjective: 2, adverb: 3 };
  function parseWikt(data, term, max) {
    var arr = data && data.en;
    if (!Array.isArray(arr) || !arr.length) return null;
    var all = [];
    arr.forEach(function (m, mi) {
      var posRaw = String(m.partOfSpeech || '');
      if (SKIP_POS.indexOf(posRaw.toLowerCase()) >= 0) return;
      (m.definitions || []).forEach(function (d) {
        var en = stripHtml(d.definition);
        if (!en) return;
        var ex = '';
        if (d.parsedExamples && d.parsedExamples[0] && d.parsedExamples[0].example) ex = stripHtml(d.parsedExamples[0].example);
        else if (d.examples && d.examples[0]) ex = stripHtml(d.examples[0]);
        ex = cleanEx(ex);
        var rank = POS_RANK[posRaw.toLowerCase()];
        all.push({ pos: POS_KO[posRaw.toLowerCase()] || posRaw, en: en, ex: ex, _r: rank == null ? 9 : rank, _i: all.length });
      });
    });
    var good = all.filter(function (s) { return !WIKT_SKIP.test(s.en); });
    var pool = good.length ? good : all;
    var brief = pool.filter(function (s) { return s.en.length <= 220; });
    if (brief.length >= 2) pool = brief;
    pool.sort(function (a, b) { return a._r - b._r || a._i - b._i; });   // 명사, 동사, 형용사, 부사 순 (같은 품사는 원래 순서)
    var picks = pickSenses(pool, max);
    if (!picks.length) return null;
    return {
      word: term, ipa: '', audio: '', ko: '',
      senses: picks.map(function (s) { return { pos: s.pos, en: s.en, ex: s.ex, koDef: '' }; }),
      manual: false, source: 'wikt'
    };
  }

  function parseOxford(d, term, max) {
    var results = d && d.results;
    if (!Array.isArray(results) || !results.length) return null;
    var all = [], ipa = '', audio = '', audioUS = '';
    results.forEach(function (r) {
      (r.lexicalEntries || []).forEach(function (le) {
        var posId = String((le.lexicalCategory && (le.lexicalCategory.id || le.lexicalCategory.text)) || '').toLowerCase();
        var pos = POS_KO[posId] || posId;
        function push(s) {
          var def = (s.definitions && s.definitions[0]) || (s.shortDefinitions && s.shortDefinitions[0]) || '';
          if (!def) return;
          var ex = (s.examples && s.examples[0] && s.examples[0].text) || '';
          all.push({ pos: pos, en: def, ex: cleanEx(ex) });
        }
        (le.entries || []).forEach(function (en) {
          (en.pronunciations || []).forEach(function (p) {
            if (p.audioFile) {
              if (!audio) audio = p.audioFile;
              if (!audioUS && JSON.stringify(p.dialects || []).indexOf('American') >= 0) audioUS = p.audioFile;
            }
            if (!ipa && p.phoneticSpelling) ipa = '/' + p.phoneticSpelling + '/';
          });
          (en.senses || []).forEach(function (s) { push(s); (s.subsenses || []).forEach(push); });
        });
      });
    });
    var picks = pickSenses(all, max);
    if (!picks.length) return null;
    return {
      word: term, ipa: ipa, audio: audioUS || audio, ko: '',
      senses: picks.map(function (s) { return { pos: s.pos, en: s.en, ex: s.ex, koDef: '' }; }),
      manual: false, source: 'oxford'
    };
  }
  function oxReason(code) {
    var sandbox = !S.oxBase || S.oxBase.indexOf('sandbox') >= 0;
    if (code === 'blocked') return 'Oxford 사전에 직접 연결하지 못했어요. 브라우저가 막았을 수 있어요.';
    if (code === 'notfound') return sandbox ? 'Oxford 샌드박스 키는 a로 시작하는 단어만 찾을 수 있어서 다른 사전으로 찾았어요.' : 'Oxford 사전에 없는 단어라서 다른 사전으로 찾았어요.';
    if (code === 'auth') return 'Oxford 인증이 거절됐어요. ID와 키를 확인해 주세요.';
    if (code === 'limit') return 'Oxford 호출 한도에 닿았어요.';
    return 'Oxford 사전을 쓰지 못해서 다른 사전으로 찾았어요.';
  }

  function parseDict(arr, w, max) {
    var e0 = arr[0] || {};
    var ph = [];
    arr.forEach(function (a) { (a.phonetics || []).forEach(function (p) { ph.push(p); }); });
    var us = ph.find(function (p) { return p.audio && /-us\./i.test(p.audio); });
    var withText = ph.find(function (p) { return p.text; });
    var all = [];
    arr.forEach(function (a) {
      (a.meanings || []).forEach(function (m) {
        (m.definitions || []).forEach(function (d) {
          all.push({ pos: POS_KO[m.partOfSpeech] || m.partOfSpeech || '', en: d.definition || '', ex: cleanEx(d.example || '') });
        });
      });
    });
    var picks = pickSenses(all, max);
    return {
      word: e0.word || w,
      ipa: (us && us.text) || (withText && withText.text) || e0.phonetic || '',
      audio: (us && us.audio) || '',
      ko: '',
      senses: picks.map(function (s) { return { pos: s.pos, en: s.en, ex: s.ex, koDef: '' }; }),
      manual: false
    };
  }

  async function tr(text) {
    var url = MM + encodeURIComponent(text) + (S.email ? '&de=' + encodeURIComponent(S.email) : '');
    var r = await fetchJson(url);
    var d = r.data || {};
    var t = (d.responseData && d.responseData.translatedText) || '';
    if (r.status === 429 || String(d.responseStatus) === '429' || /MYMEMORY WARNING/i.test(t)) throw { quota: true };
    var matches = (d.matches || []).slice().sort(function (a, b) { return (b.match || 0) - (a.match || 0); })
      .map(function (m) { return m.translation; });
    return [t].concat(matches).filter(Boolean);
  }
  async function koShort(word) {
    var list = await tr(word);
    var out = [];
    list.forEach(function (x) {
      x = String(x).trim().replace(/[\s:;,.!?]+$/, '');
      if (HANGUL.test(x) && x.length <= 18 && out.indexOf(x) < 0 && out.length < 3) out.push(x);
    });
    return out.join(' / ');
  }

  /* ---------- 예문 보충: Tatoeba (사람이 쓴 예문 + 한국어 번역) ---------- */
  var TAT = 'https://tatoeba.org/eng/api_v0/search?from=eng&sort=relevance&to=kor&query=';
  function pickKo(s) {
    var out = '';
    (function walk(x) {
      if (!x || out) return;
      if (Array.isArray(x)) { x.forEach(walk); return; }
      if (typeof x === 'object') {
        if (x.lang === 'kor' && x.text) { out = String(x.text); return; }
        if (x.translations) walk(x.translations);
      }
    })(s && s.translations);
    return out;
  }
  async function tatoebaSearch(q, koOnly) {
    var url = TAT + encodeURIComponent(q) + (koOnly ? '&trans_filter=limit&trans_link=direct&trans_to=kor' : '');
    var r = await fetchJson(url, 7000);
    var res = r.data && r.data.results;
    if (!Array.isArray(res)) return [];
    return res.map(function (s) { return { en: String((s && s.text) || ''), ko: pickKo(s) }; })
      .filter(function (x) { return x.en.length >= 15 && x.en.length <= 120; });
  }
  async function fillExamples(entry) {
    var term = entry.word;
    var q = term.indexOf(' ') >= 0 ? '"' + term + '"' : '=' + term;
    var list = await tatoebaSearch(q, true);
    if (list.length < 3) list = list.concat(await tatoebaSearch(q, false));
    var seen = {}, uniq = [];
    list.forEach(function (x) { if (!seen[x.en]) { seen[x.en] = 1; uniq.push(x); } });
    uniq.sort(function (a, b) { return (b.ko ? 1 : 0) - (a.ko ? 1 : 0) || a.en.length - b.en.length; });
    var i = 0;
    entry.senses.forEach(function (s) {
      if (!s.ex && uniq[i]) { s.ex = uniq[i].en; s.exKo = uniq[i].ko || ''; i++; }
    });
    entry.exSource = i ? 'tatoeba' : '';
  }

  var LS_TR = 'companyWords:trcache';
  var trMem = null;
  async function trBest(text) {
    if (trMem === null) { try { trMem = JSON.parse(localStorage.getItem(LS_TR) || '{}'); } catch (e) { trMem = {}; } }
    if (trMem[text]) return trMem[text];
    var list = await tr(text);
    var t = '';
    for (var i = 0; i < list.length; i++) { if (HANGUL.test(list[i])) { t = String(list[i]); break; } }
    if (t) {
      trMem[text] = t;
      var keys = Object.keys(trMem);
      if (keys.length > 400) delete trMem[keys[0]];
      try { localStorage.setItem(LS_TR, JSON.stringify(trMem)); } catch (e) {}
    }
    return t;
  }
  async function translateSenses(senses, onStep) {
    var quota = false;
    for (var i = 0; i < senses.length; i++) {
      var s = senses[i];

  async function photoToJpeg(file, maxDim) {
    var url = URL.createObjectURL(file);
    try {
      var img = await new Promise(function (res, rej) {
        var im = new Image();
        im.onload = function () { res(im); };
        im.onerror = function () { rej({ photo: 'format' }); };
        im.src = url;
      });
      var s = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * s));
      c.height = Math.max(1, Math.round(img.naturalHeight * s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var dataUrl = c.toDataURL('image/jpeg', 0.85);
      return { dataUrl: dataUrl, data: dataUrl.split(',')[1] };
    } finally { URL.revokeObjectURL(url); }
  }

      'Rules:',
      '1. Read all printed or handwritten text in the photo (English and/or Korean).',
      '2. Mode "auto": if some words are marked (underlined, highlighted, circled, starred or written in the margin), return ONLY those marked words. Otherwise, if the photo is a vocabulary list or glossary, return the headwords (not the definitions). Otherwise return up to 15 words that are most likely new for this reader: ' + level + '.',
      '3. Mode "all": return every distinct meaningful word in reading order, skipping articles, pronouns, prepositions and other very common function words (up to 30).',

  async function bulkLookup() {
    var B = S.bulk;
    if (B.loading) return;
    var raw = S.bulkText.split(/[\n,;\t]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    var seen = {}, list = [], skipped = 0;
    raw.forEach(function (w) {
      var k = w.toLowerCase();
      if (seen[k]) return;
      seen[k] = 1;
      var id = wordId(w);
      if (S.words.some(function (x) { return x.id === id; }) || B.results.some(function (r) { return r.id === id; })) { skipped++; return; }
      list.push(w);
    });
    S.msg = ''; S.note = '';
    if (!list.length) {
      S.msg = raw.length ? '새로 찾을 단어가 없어요. 이미 저장했거나 같은 단어예요.' : '단어를 한 줄에 하나씩, 또는 쉼표로 구분해 넣어주세요.';
      render(); return;
    }
    if (list.length > 20) { list = list.slice(0, 20); S.note = '사용 한도 때문에 한 번에 20개까지만 찾아요.'; }
    if (!S.gemKey && list.some(function (x) { return !HANGUL.test(x); })) {
      S.msg = '영어 단어는 Gemini로 뜻을 정리해요. 단어장 탭 맨 아래 설정에서 Gemini 키를 먼저 넣어주세요.';
      render(); return;
    }
    B.loading = true; B.bad = []; B.skipped = skipped;
    var total = list.length;
    B.prog = '0 / ' + total;
    render();
    var quotaHit = false;
    var srcList = activeSources();
    S.curTag = S.tag === '국어' ? '영어' : S.tag;
    var pre = {}, gemBad = false;
    if (srcList[0] === 'gemini') {                       // 1순위가 Gemini면 5개씩 묶어서 한꺼번에 정리
      var enWords = list.filter(function (x) { return !HANGUL.test(x); });
      for (var gi = 0; gi < enWords.length; gi += 5) {
        var chunk = enWords.slice(gi, gi + 5);
        B.prog = 'Gemini 정리 ' + Math.min(gi + 5, enWords.length) + ' / ' + enWords.length;
        render();
        try {
          var arr = await gemEntriesBatch(chunk);
          chunk.forEach(function (cw, ci) {
            var d = arr.find(function (x) { return x && String(x.input || '').toLowerCase() === cw.toLowerCase(); }) || arr[ci];
            var ge = gemObjToEntry(d, cw, 3);
            if (ge) { ge.quota = false; ge.dictDown = false; ge.deferred = false; ge.fails = {}; ge.tried = ['gemini']; pre[cw.toLowerCase()] = ge; }
          });
        } catch (gerr) {
          gemBad = true;
          S.msg = 'Gemini를 쓰지 못했어요. ' + gemReason((gerr && gerr.gem) || 'other') + gemDetail() + ' 못 찾은 단어는 목록에 남겨둘게요.';
          break;
        }
        if (gi + 5 < enWords.length) await sleep(1500);
      }
    }
    var gemForTr = !!S.gemKey && !S.off.gemini && !gemBad;
    var skipOpt = srcList[0] === 'gemini' ? { gemini: true } : null;
    for (var i = 0; i < list.length; i++) {
      var w = list[i];
      var fromGem = false;
      try {
        var e;
        if (HANGUL.test(w)) e = await buildKoEntry(w, false);
        else if (pre[w.toLowerCase()]) { e = pre[w.toLowerCase()]; fromGem = true; }
        else e = { word: w, manual: true, senses: [], quota: false, dictDown: false };
        if (e.dictDown) {
          B.bad = B.bad.concat(list.slice(i));
          S.msg = '사전 서버가 응답하지 않아요. 잠시 뒤에 다시 시도해 주세요.';
          break;
        }
        var id = wordId(e.word);
        if (e.manual || B.results.some(function (r) { return r.id === id; }) || S.words.some(function (x) { return x.id === id; })) {
          B.bad.push(w);
        } else {
          e.id = id; e.tag = HANGUL.test(w) ? '국어' : (S.tag === '국어' ? '영어' : S.tag); B.results.push(e);
        }
        if (e.quota) quotaHit = true;
      } catch (err) {
        B.bad.push(w);
      }
      B.prog = (i + 1) + ' / ' + total;
      render();
      if (!fromGem) await sleep(300);
    }
    if (gemForTr && B.results.length) await bulkGemTranslate(B);
    B.loading = false;
    if (quotaHit) S.msg = QUOTA_MSG;
    render();
  }

  function startRun(words, round) {
    var run = { items: shuffle(words), i: 0, mode: S.quiz.mode, round: round || 1, answered: null, hint: false, rightIds: [], wrongIds: [], done: false, q: null,
      score: 0, streak: 0, best: 0, lastPoints: 0 };
    S.quiz.run = run;
    buildQ(run);
    render();
  }
  function buildQ(run) {
    var w = run.items[run.i];
    run.answered = null; run.hint = false; run.q = null; run.typed = ''; run.judging = false;
    if (run.mode === 'mc') {
      var correct = meaning(w);
      var seen = {}; seen[correct] = 1;
      var d = [];
      var others = S.words.filter(function (x) { return x.id !== w.id; });
      var tier1 = others.filter(function (x) { return langOf(x) === langOf(w) && tagOf(x) === tagOf(w); });
      var tier2 = others.filter(function (x) { return langOf(x) === langOf(w) && tagOf(x) !== tagOf(w); });
      var tier3 = others.filter(function (x) { return langOf(x) !== langOf(w); });
      shuffle(tier1).concat(shuffle(tier2), shuffle(tier3)).forEach(function (x) {
        var m = meaning(x);
        if (d.length < 3 && !seen[m]) { seen[m] = 1; d.push(m); }
      });
      var opts = shuffle([correct].concat(d));
      run.q = { opts: opts, correct: opts.indexOf(correct) };
    }
  }
  function record(w, ok) {
    var nw = JSON.parse(JSON.stringify(w));
    if (ok) { nw.right = (nw.right || 0) + 1; nw.wrong = false; }
    else { nw.miss = (nw.miss || 0) + 1; nw.wrong = true; }
    putWord(nw, true);
    var run = S.quiz.run;
    run.items[run.i] = nw;
    (ok ? run.rightIds : run.wrongIds).push(nw.id);
    if (ok) {
      run.streak++;
      if (run.streak > run.best) run.best = run.streak;
      run.lastPoints = 100 + Math.min(run.streak - 1, 5) * 20;
      run.score += run.lastPoints;
      beep('ok');
    } else {
      run.streak = 0; run.lastPoints = 0;
      beep('bad');
    }
  }

    var tol = ko ? (L >= 4 ? 1 : 0) : (L >= 9 ? 2 : (L >= 5 ? 1 : 0));
    if (tol && lev(t, a) <= tol) return { ok: true, kind: 'close' };

  }

  function startEdit(id) {

        S.msg = ''; S.note = S.gemKey ? 'Gemini 설정을 저장했어요.' : 'Gemini를 껐어요.';
        render();
        if (S.gemKey) gemTest();                              // 저장하면 모델을 자동으로 찾고 바로 연결을 확인
        break;
      case 'mailsave':
        var m = document.getElementById('mail');
        S.email = m ? m.value.trim() : '';
        try { localStorage.setItem(LS_MAIL, S.email); } catch (err) {}
        S.note = S.email ? '이메일을 저장했어요.' : '이메일을 지웠어요.';
        render(); break;
      case 'qdate': Q.dates[D.d] = !Q.dates[D.d]; render(); break;
      case 'qall': quizWords().forEach(function (w) { Q.dates[w.date] = true; }); render(); break;
      case 'qnone': Q.dates = {}; render(); break;
      case 'qwrong': Q.onlyWrong = !Q.onlyWrong; render(); break;
      case 'qmode': Q.mode = D.m; render(); break;
      case 'qstart':
        if (S.warp) break;
        beep('ok');
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { startRun(pool(), 1); break; }
        S.warp = true; render();
        setTimeout(function () { S.warp = false; startRun(pool(), 1); }, 1100);
        break;
      case 'snd':
        soundOn = !soundOn;
        try { localStorage.setItem('companyWords:snd', soundOn ? 'on' : 'off'); } catch (err) {}
        if (soundOn) beep('ok');
        render(); break;
      case 'pick': answerMC(Number(D.i)); break;
      case 'submit': answerType(); break;
      case 'hint': Q.run.hint = true; render(); break;
      case 'next': stopLoop(); nextQ(); break;
      case 'retry':
        var ids = Q.run.wrongIds;
        startRun(S.words.filter(function (w) { return ids.indexOf(w.id) >= 0; }), Q.run.round + 1);
        break;
      case 'qquit': stopLoop(); Q.run = null; render(); break;
    }
  });
  document.addEventListener('input', function (e) {
    var id = e.target && e.target.id;
    if (id === 'q') S.q = e.target.value;
    else if (id === 'bulk') S.bulkText = e.target.value;
    else if (id === 'foundKo') S.foundKo = e.target.value;
    else if (id === 'foundEn') S.foundEn = e.target.value;
  });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'imp' && e.target.files && e.target.files[0]) importWords(e.target.files[0]);
    if (e.target && (e.target.id === 'photo-cam' || e.target.id === 'photo-pick') && e.target.files && e.target.files[0]) {
      var pf = e.target.files[0];
      handlePhoto(pf);
      try { e.target.value = ''; } catch (err) {}
    }
    if (e.target && e.target.id === 'photo-mode') S.photoMode = e.target.value;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.isComposing) return;
    var qr = S.quiz.run;
    if (S.tab === 'quiz' && qr && qr.answered && !qr.done && !(e.target && /^(INPUT|TEXTAREA|BUTTON)$/.test(e.target.tagName))) { stopLoop(); nextQ(); return; }
    if (e.target && e.target.id === 'q') { S.q = e.target.value; lookup(); }
    if (e.target && e.target.id === 'ans') answerType();
  });

  S.words = lsLoad();
  try { S.email = localStorage.getItem(LS_MAIL) || ''; var savedKey = localStorage.getItem(LS_KRKEY); S.krKey = savedKey === null ? KR_KEY_BUILTIN : savedKey; S.krBase = localStorage.getItem(LS_KRBASE) || '';
    S.gemKey = localStorage.getItem(LS_GEMKEY) || ''; S.gemModel = ''; localStorage.removeItem(LS_GEMMODEL); S.gemQuality = localStorage.getItem(LS_GEMQ) === '1';
    S.purpose = localStorage.getItem(LS_PURPOSE) || '';
    S.tag = normTag(localStorage.getItem(LS_TAG)) || '영어';
    var ord = JSON.parse(localStorage.getItem(LS_ORDER) || 'null');
    if (ord && Array.isArray(ord.order)) {
      var base = ['gemini', 'oxford', 'free', 'wikt'];
      S.order = ord.order.filter(function (x) { return base.indexOf(x) >= 0; });
      base.forEach(function (x) { if (S.order.indexOf(x) < 0) S.order.push(x); });
      S.off = ord.off || {};
    } } catch (e) {}
  var dc = document.getElementById('decor');
  if (dc) dc.innerHTML = '<div class="planet"></div><div class="ship">' + SHIP_SVG + '</div><div class="drone">' + robotSVG('idle') + '</div>';
  render();
})();

</script>
</body>
</html>
