<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="회사 단어장">
<title>회사 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F2F5F6; --card:#FFFFFF; --ink:#14262B; --mute:#5B6E73; --line:#D3DDE0;
  --acc:#0E6B73; --acc-ink:#FFFFFF; --accbg:#E1F0F1;
  --ok:#1F7A46; --okbg:#E3F3EA; --bad:#B8400E; --badbg:#FBE9E0;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --serif:'Noto Serif KR','Batang','AppleMyungjo',Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0F1A1D; --card:#172529; --ink:#E6EEF0; --mute:#93A8AD; --line:#2B3E43;
    --acc:#4FB7BF; --acc-ink:#0A1C1F; --accbg:#183338;
    --ok:#5CC48A; --okbg:#173326; --bad:#F08A5A; --badbg:#3A2218;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F1A1D; --card:#172529; --ink:#E6EEF0; --mute:#93A8AD; --line:#2B3E43;
  --acc:#4FB7BF; --acc-ink:#0A1C1F; --accbg:#183338;
  --ok:#5CC48A; --okbg:#173326; --bad:#F08A5A; --badbg:#3A2218;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding-bottom:84px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px}
header h1{font-family:var(--serif);font-size:26px;margin:0;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap-r{flex-wrap:wrap}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{display:block;width:100%;min-height:130px;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.modes{display:flex;gap:8px;margin-top:14px}
.modes button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px;font-weight:500}
.modes button[aria-pressed="true"]{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.brow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.brow .bi{flex:1;min-width:0}
.brow .bw{font-family:var(--serif);font-weight:700;font-size:18px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:500}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.mute{color:var(--mute)}
.small{font-size:13px}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--badbg);color:var(--bad);font-size:14px}
.note{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accbg);color:var(--ink);font-size:14px}

/* 사전 항목 */
.entry .hw{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.entry .word{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.entry .ipa{color:var(--mute);font-size:15px}
.spk{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;padding:0;flex:none}
.spk svg{width:18px;height:18px;fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spk.sm{width:30px;height:30px}.spk.sm svg{width:15px;height:15px}
.sense{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.sense:first-of-type{margin-top:12px}
.pos{display:inline-block;font-size:12px;font-weight:600;color:var(--acc);background:var(--accbg);border-radius:6px;padding:1px 8px;margin-right:6px}
.ko{font-weight:600;font-size:16px}
.en{margin:4px 0 0;color:var(--ink)}
.ex{margin:8px 0 0;padding-left:12px;border-left:3px solid var(--line)}
.ex .e{display:flex;gap:6px;align-items:flex-start;font-style:italic}
.ex .k{color:var(--mute);font-size:14px;margin-top:2px}

/* 단어장 목록 */
.group{margin-top:22px}
.group h3{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--mute);display:flex;justify-content:space-between}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.item .top{display:flex;align-items:stretch}
.item .top>button.head{all:unset;box-sizing:border-box;display:flex;flex:1;min-width:0;gap:10px;align-items:center;padding:12px 6px 12px 14px;cursor:pointer}
.item .top>button.head:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.item .x{flex:none;min-width:48px;border:0;background:none;color:var(--mute);font-size:24px;line-height:1;padding:0 12px;cursor:pointer}
.item .x.armed{color:var(--bad);font-size:13px;font-weight:600;white-space:nowrap}
.item .iw{font-family:var(--serif);font-weight:700;font-size:18px}
.item .im{color:var(--mute);font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;background:var(--badbg);color:var(--bad);flex:none}
.item .detail{padding:0 14px 14px;border-top:1px solid var(--line)}
.item .detail .entry .sense:first-of-type{margin-top:6px;border-top:none;padding-top:0}
.danger{color:var(--bad);border-color:var(--bad)}
.edit label{display:block;margin-top:10px}
.edit input[type=text]{width:100%;margin-top:4px;font-size:15px;padding:9px 11px}

/* 퀴즈 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.seg{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;text-align:left}
.seg button[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg);box-shadow:inset 0 0 0 1px var(--acc)}
.seg b{display:block;font-size:14px}
.seg span{font-size:12px;color:var(--mute)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--acc)}
.q-word{font-family:var(--serif);font-size:34px;font-weight:700;margin:6px 0 0}
.q-ko{font-size:20px;font-weight:600;margin:6px 0}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;text-align:left;font-size:15px}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.verdict{margin-top:14px;padding:10px 12px;border-radius:10px;font-weight:600}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.no{background:var(--badbg);color:var(--bad)}
.score{display:flex;gap:10px;margin-top:12px}
.score div{flex:1;border-radius:12px;padding:12px;text-align:center}
.score .r{background:var(--okbg);color:var(--ok)}
.score .w{background:var(--badbg);color:var(--bad)}
.score b{display:block;font-size:30px;font-family:var(--serif);line-height:1.1}
.rl{list-style:none;margin:8px 0 0;padding:0}
.rl li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rl li b{font-family:var(--serif);min-width:90px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;border:0;background:none;padding:12px 0 10px;font-size:14px;color:var(--mute);font-weight:500}
nav.tabs button[aria-current="page"]{color:var(--acc);font-weight:600;box-shadow:inset 0 3px 0 var(--acc)}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.dots::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:d 1.2s steps(4,end) infinite}
@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@media (prefers-reduced-motion: reduce){.dots::after{animation:none;content:'…'}}

/* ===== 퀴즈: 우주 오페라 테마 (원작 이름과 로고는 쓰지 않은 오리지널 디자인) ===== */
body.space{
  color-scheme:dark;
  --bg:#05070F; --card:rgba(12,20,44,.82); --ink:#E8F0FF; --mute:#8EA2C9; --line:#243662;
  --acc:#4FD1FF; --acc-ink:#021018; --accbg:rgba(79,209,255,.13);
  --ok:#5CFFB0; --okbg:rgba(92,255,176,.12); --bad:#FF7A66; --badbg:rgba(255,107,90,.15);
  --gold:#FFD36B; --orb:'Orbitron','IBM Plex Sans KR',system-ui,sans-serif;
  background-color:#05070F;
  background-image:
    radial-gradient(1.2px 1.2px at 20px 30px,#fff,transparent),
    radial-gradient(1px 1px at 90px 120px,rgba(255,255,255,.8),transparent),
    radial-gradient(1.6px 1.6px at 160px 60px,#9fdcff,transparent),
    radial-gradient(1px 1px at 230px 200px,#fff,transparent),
    radial-gradient(1px 1px at 60px 220px,rgba(255,255,255,.7),transparent),
    radial-gradient(ellipse at 50% -10%,rgba(79,209,255,.20),transparent 60%),
    radial-gradient(ellipse at 100% 100%,rgba(140,90,255,.14),transparent 55%);
  background-size:260px 260px,260px 260px,260px 260px,260px 260px,260px 260px,100% 100%,100% 100%;
  background-attachment:fixed;
}
body.space header h1{font-family:var(--orb);font-size:20px;letter-spacing:.04em;text-shadow:0 0 14px rgba(79,209,255,.5)}
body.space header p{display:none}
body.space .card{border-color:rgba(79,209,255,.32);box-shadow:0 0 0 1px rgba(79,209,255,.05),0 8px 30px rgba(0,0,0,.35);backdrop-filter:blur(3px)}
body.space .card h2{font-family:var(--orb);font-size:13px;letter-spacing:.1em;color:var(--acc);font-weight:600}
body.space .btn{background:rgba(8,14,32,.7)}
body.space .btn.pri{background:linear-gradient(180deg,#6FDCFF,#2BA8E0);color:var(--acc-ink);border-color:#7FE3FF;font-weight:600;box-shadow:0 0 18px rgba(79,209,255,.4)}
body.space .btn.pri:disabled{box-shadow:none}
body.space nav.tabs{backdrop-filter:blur(6px)}
body.space .chip{background:rgba(8,14,32,.7)}
body.space .chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);box-shadow:0 0 14px rgba(79,209,255,.5)}
body.space .seg button{background:rgba(8,14,32,.7)}
body.space .seg button[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg);box-shadow:0 0 16px rgba(79,209,255,.3),inset 0 0 0 1px var(--acc)}
body.space .seg b{font-size:15px}
body.space input[type=text]{background:#060B1A;border-color:var(--line)}
body.space .note{background:var(--accbg)}
.hero{text-align:center;padding:10px 0 4px;perspective:500px}
.hero-t{font-family:var(--orb,'Orbitron',sans-serif);font-weight:800;font-size:30px;letter-spacing:.14em;color:var(--ink);transform:rotateX(16deg);text-shadow:0 0 22px rgba(79,209,255,.75),0 0 2px #fff}
.hero-s{margin-top:6px;color:var(--mute);font-size:14px}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hud .hi{font-family:var(--orb,'Orbitron',sans-serif);font-size:12px;letter-spacing:.08em;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:rgba(8,14,32,.6)}
.hud .hi b{font-size:16px;color:var(--ink);margin-left:4px}
.hud .hi.score b{color:var(--gold)}
.hud .hi.combo b{color:var(--ok);text-shadow:0 0 10px rgba(92,255,176,.7)}
.hud .sp{flex:1}
.cap{margin:14px 0 2px;font-size:13px;color:var(--acc);letter-spacing:.06em}
body.space .prog{height:9px;background:#0B1530;border:1px solid var(--line);border-radius:6px;margin:12px 0 4px}
body.space .prog i{border-radius:5px;background:linear-gradient(90deg,#2BA8E0,#9FF0FF 85%,#fff);box-shadow:0 0 12px 2px rgba(79,209,255,.7);transition:width .5s}
body.space .q-word{font-size:36px;text-shadow:0 0 18px rgba(79,209,255,.35)}
body.space .q-ko{font-size:21px}
body.space .opt{background:rgba(8,14,32,.7)}
body.space .opt:hover:not(:disabled){border-color:var(--acc);box-shadow:0 0 14px rgba(79,209,255,.35)}
body.space .opt.right{box-shadow:0 0 20px rgba(92,255,176,.45)}
body.space .opt.wrong{animation:shake .35s}
body.space .verdict{font-family:inherit;border:1px solid currentColor}
body.space .verdict .pts{float:right;font-family:var(--orb);color:var(--gold)}
body.space .spk{background:rgba(8,14,32,.7)}
.launch{margin-top:18px;padding:16px;font-family:var(--orb,'Orbitron',sans-serif);font-size:17px;letter-spacing:.14em}
.rank{text-align:center;padding:6px 0 2px}
.rank .rt{font-family:var(--orb,'Orbitron',sans-serif);font-weight:800;font-size:22px;letter-spacing:.1em;color:var(--gold);text-shadow:0 0 18px rgba(255,211,107,.6)}
.rank .rs{color:var(--mute);font-size:13px;margin-top:2px}
.rank .big{font-family:var(--orb,'Orbitron',sans-serif);font-weight:800;font-size:40px;color:var(--ink);margin:10px 0 2px;text-shadow:0 0 18px rgba(79,209,255,.6)}
.stats{display:flex;gap:8px;margin-top:12px}
.stats div{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 4px;background:rgba(8,14,32,.6);font-size:12px;color:var(--mute)}
.stats b{display:block;font-family:var(--orb,'Orbitron',sans-serif);font-size:18px;color:var(--ink)}
.warp{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden;animation:warpbg 1.1s ease-in forwards}
.warp::before{content:'';position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(170,225,255,.95) 0 .55deg,transparent .55deg 4.5deg);animation:warpzoom 1.1s cubic-bezier(.55,0,1,.55) forwards}
@keyframes warpzoom{from{transform:scale(.08);opacity:0}25%{opacity:1}to{transform:scale(3.2);opacity:1}}
@keyframes warpbg{0%{background:rgba(0,0,0,0)}20%{background:rgba(0,2,10,.92)}80%{background:rgba(0,2,10,.92)}92%{background:rgba(190,235,255,.85)}100%{background:rgba(190,235,255,0);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.warp{display:none}body.space .opt.wrong{animation:none}body.space .prog i{transition:none}}

/* ===== 사전 화면: 품사 묶음 + 번호 + 예문(듣기/반복) ===== */
.posh{color:var(--acc);font-size:14px;font-weight:600;margin:18px 0 4px}
.sn{display:flex;gap:8px;margin-top:12px}
.sn .no{flex:none;min-width:1.5em;font-weight:600;color:var(--mute)}
.sn .sb{flex:1;min-width:0}
.smain{font-size:16px;font-weight:600;line-height:1.5}
.sdef{margin-top:2px;color:var(--mute);font-size:13px}
.ex2{margin-top:10px;padding-left:12px;border-left:3px solid var(--line)}
.ex2 .e{font-size:15px}
.ex2 .k{color:var(--mute);font-size:14px;margin-top:2px}
.pill{display:inline-flex;margin:8px 0 4px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.pill button{border:0;background:none;padding:6px 14px;display:grid;place-items:center;cursor:pointer}
.pill button+button{border-left:1px solid var(--line)}
.pill svg{width:18px;height:18px;fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill button.on{background:var(--accbg)}
.pill button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
/* ===== 퀴즈 배경 캐릭터 (오리지널 우주선과 로봇) ===== */
#decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
body.space #decor{display:block}
.wrap{position:relative;z-index:1}
.planet{position:absolute;top:-70px;right:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#b794ff,#5b3fd0 55%,#1c1450);box-shadow:0 0 50px rgba(140,90,255,.35);opacity:.8}
.planet::after{content:'';position:absolute;left:-30%;right:-30%;top:46%;height:22%;border-radius:50%;border:3px solid rgba(255,211,107,.55);transform:rotate(-14deg)}
.ship{position:absolute;top:13%;left:0;width:96px;animation:fly 38s linear infinite}
.ship svg{width:100%;height:auto;display:block}
.flame{transform-box:fill-box;transform-origin:100% 50%;animation:flick .18s steps(2) infinite}
.drone{position:absolute;left:3%;top:48%;width:110px;opacity:.4;animation:bob 7s ease-in-out infinite}
.drone svg{width:100%;height:auto;display:block}
.bot{display:inline-block;vertical-align:middle;flex:none;line-height:0}
.bot svg{width:40px;height:40px}
.bot.happy{animation:hop .5s}
.bot.sad{animation:shake .4s}
.herobot{display:grid;place-items:center;margin-bottom:2px}
.herobot svg{width:64px;height:64px}
@keyframes fly{from{transform:translateX(-140px) rotate(-5deg)}to{transform:translateX(calc(100vw + 40px)) rotate(4deg)}}
@keyframes bob{0%,100%{transform:translateY(-12px) rotate(-3deg)}50%{transform:translateY(12px) rotate(3deg)}}
@keyframes flick{from{transform:scaleX(1)}to{transform:scaleX(.7)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
@media (prefers-reduced-motion: reduce){.ship,.drone,.flame,.bot.happy,.bot.sad{animation:none}.ship{left:68%}}
</style>
</head>
<body>
<div id="decor" aria-hidden="true"></div>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script>
(function () {
  'use strict';

  /* ---------- 작은 도구들 ---------- */
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmtDate(s) {
    var d = new Date(s + 'T00:00:00');
    if (isNaN(d)) return s;
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + '일월화수목금토'[d.getDay()] + ')';
  }

  /* ---------- 여러 개 한꺼번에 찾기 ---------- */
  async function bulkLookup() {
    var B = S.bulk;
    if (B.loading) return;
    var raw = S.bulkText.split(/[\n,;\t]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    var seen = {}, list = [], skipped = 0;
    raw.forEach(function (w) {
      var k = w.toLowerCase();
      if (seen[k]) return;
      seen[k] = 1;
      var id = wordId(w);
      if (S.words.some(function (x) { return x.id === id; }) || B.results.some(function (r) { return r.id === id; })) { skipped++; return; }
      list.push(w);
    });
    S.msg = ''; S.note = '';
    if (!list.length) {
      S.msg = raw.length ? '새로 찾을 단어가 없어요. 이미 저장했거나 같은 단어예요.' : '단어를 한 줄에 하나씩, 또는 쉼표로 구분해 넣어주세요.';
      render(); return;
    }
    if (list.length > 20) { list = list.slice(0, 20); S.note = '무료 번역 한도 때문에 한 번에 20개까지만 찾아요.'; }
    B.loading = true; B.bad = []; B.skipped = skipped;
    var total = list.length;
    B.prog = '0 / ' + total;
    render();
    var quotaHit = false;
    for (var i = 0; i < list.length; i++) {
      var w = list[i];
      try {
        var e = HANGUL.test(w) ? await buildKoEntry(w, false) : await buildEntry(w);
        if (e.dictDown) {
          B.bad = B.bad.concat(list.slice(i));
          S.msg = '사전 서버가 응답하지 않아요. 잠시 뒤에 다시 시도해 주세요.';
          break;
        }
        var id = wordId(e.word);
        if (e.manual || B.results.some(function (r) { return r.id === id; }) || S.words.some(function (x) { return x.id === id; })) {
          B.bad.push(w);
        } else {
          e.id = id; B.results.push(e);
        }
        if (e.quota) quotaHit = true;
      } catch (err) {
        B.bad.push(w);
      }
      B.prog = (i + 1) + ' / ' + total;
      render();
      await sleep(300);
    }
    B.loading = false;
    if (quotaHit) S.msg = QUOTA_MSG;
    render();
  }

  /* ---------- 주관식 채점: 오타, 활용형, 비슷한 뜻도 인정 ---------- */

      if (Math.max(t.length, n.length) >= 4 && lev(t, n) <= (Math.max(t.length, n.length) >= 8 ? 2 : 1)) return { ok: true, kind: 'similar' };

    else body = S.quiz.run ? viewQuizRun() : viewQuizSetup();
    document.body.classList.toggle('space', S.tab === 'quiz');
    $('#app').innerHTML = '<header><h1>회사 단어장</h1><p>이 기기에 저장 중 · 무료 사전 API 사용</p></header>' + body +
      (S.msg && S.tab === 'list' ? '<div class="msg" role="alert">' + esc(S.msg) + '</div>' : '') +
      (S.warp ? '<div class="warp" aria-hidden="true"></div>' : '');
    var tabs = [['add', '추가'], ['list', '단어장 ' + S.words.length], ['quiz', '퀴즈']];
    $('#tabs').innerHTML = tabs.map(function (t) {
      return '<button data-act="tab" data-t="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : '') + '>' + esc(t[1]) + '</button>';
    }).join('');
    if (S.tab === 'quiz' && S.quiz.run && !S.quiz.run.done && S.quiz.run.mode !== 'mc' && !S.quiz.run.answered) {
      setTimeout(function () { var el = $('#ans'); if (el) el.focus(); }, 30);
    }
  }

  /* ---------- 저장한 단어 수정 ---------- */
  function fld(label, id, val, ph) {
    return '<label class="small mute" for="' + id + '">' + label + '</label>' +
      '<input type="text" id="' + id + '" value="' + esc(val) + '" placeholder="' + esc(ph || '') + '" autocomplete="off" autocapitalize="none" spellcheck="false">';
  }
  function editHTML() {
    var d = S.edit.draft;
    var h = '<div class="edit">' + fld('단어', 'ed-word', d.word) + fld(S.edit.lang === 'ko' ? '한국어 뜻 (퀴즈에 나오는 뜻)' : '퀴즈에 나오는 뜻', 'ed-ko', d.ko, '예: 송장 / 청구서') +
      (S.edit.lang === 'ko' ? fld('영어 뜻', 'ed-enm', d.enm, '예: normally') : '');
    d.senses.forEach(function (s, i) {
      h += '<div class="sense"><div class="row" style="justify-content:space-between"><b class="small">뜻 ' + (i + 1) + '</b>' +
        '<button class="btn small" data-act="edsdrop" data-i="' + i + '">이 뜻 빼기</button></div>' +
        fld('품사 (명, 동, 형…)', 'ed-pos-' + i, s.pos) + fld('한글 풀이', 'ed-kd-' + i, s.koDef) +
        fld('영어 뜻', 'ed-en-' + i, s.en) + fld('예문', 'ed-ex-' + i, s.ex) + fld('예문 한글 번역', 'ed-exko-' + i, s.exKo) + '</div>';
    });
    return h + '<div style="margin-top:12px"><button class="btn small" data-act="edsadd">+ 뜻 추가</button></div>' +
      '<div class="row" style="margin-top:16px"><button class="btn pri" data-act="edsave" style="flex:1">수정 저장</button>' +
      '<button class="btn" data-act="edcancel">취소</button></div></div>';
  }
  function startEdit(id) {
    var w = S.words.find(function (x) { return x.id === id; });
    if (!w) return;
    S.edit = { id: id, lang: langOf(w), draft: { word: w.word, ko: w.ko || '', enm: w.enm || '', senses: JSON.parse(JSON.stringify(w.senses || [])) } };
    S.delArm = null; S.msg = '';
    render();
  }
  function collectEdit() {
    var E = S.edit;
    if (!E) return;
    function v(id) { var el = document.getElementById(id); return el ? el.value : null; }
    var wd = v('ed-word'); if (wd !== null) E.draft.word = wd;
    var ko = v('ed-ko'); if (ko !== null) E.draft.ko = ko;
    var enm = v('ed-enm'); if (enm !== null) E.draft.enm = enm;
    var map = { pos: 'ed-pos-', koDef: 'ed-kd-', en: 'ed-en-', ex: 'ed-ex-', exKo: 'ed-exko-' };
    E.draft.senses.forEach(function (s, i) {
      Object.keys(map).forEach(function (k) { var x = v(map[k] + i); if (x !== null) s[k] = x; });
    });
  }
  function saveEdit() {
    collectEdit();
    var E = S.edit;
    if (!E) return;
    var w0 = S.words.find(function (x) { return x.id === E.id; });
    if (!w0) { S.edit = null; render(); return; }
    var word = E.draft.word.trim();
    if (!word) { S.msg = '단어는 비워둘 수 없어요.'; render(); return; }
    var nid = wordId(word);
    if (S.words.some(function (x) { return x.id !== E.id && x.id === nid; })) { S.msg = '같은 단어가 이미 단어장에 있어요.'; render(); return; }
    var nw = JSON.parse(JSON.stringify(w0));
    if (word.toLowerCase() !== String(w0.word).toLowerCase()) { nw.audio = ''; nw.ipa = ''; }
    nw.word = word;
    nw.ko = E.draft.ko.trim();
    if (E.lang === 'ko') nw.enm = String(E.draft.enm || '').trim();
    nw.senses = E.draft.senses.map(function (s) {
      return { pos: String(s.pos || '').trim(), koDef: String(s.koDef || '').trim(), en: String(s.en || '').trim(), ex: String(s.ex || '').trim(), exKo: String(s.exKo || '').trim() };
    }).filter(function (s) { return s.en || s.koDef; });
    S.edit = null; S.msg = '';
    putWord(nw);
  }

  /* ---------- 백업 ---------- */
  function exportWords() {
    try {
      var blob = new Blob([JSON.stringify(S.words, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'company-words-' + today() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    } catch (e) { S.msg = '내보내기에 실패했어요.'; render(); }
  }
  function importWords(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var arr = JSON.parse(fr.result);
        if (!Array.isArray(arr)) throw new Error('bad');
        var n = 0;
        arr.forEach(function (w) {
          if (!w || !w.id || !w.word || !Array.isArray(w.senses)) return;
          if (S.words.some(function (x) { return x.id === w.id; })) return;
          migrate([w]); putWord(w, true); n++;
        });
        S.msg = ''; S.note = n + '개를 가져왔어요.';
      } catch (e) { S.msg = '파일을 읽지 못했어요. 이 앱에서 내보낸 .json 파일인지 확인해 주세요.'; }
      render();
    };
    fr.readAsText(file);
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var act = b.getAttribute('data-act');
    var D = b.dataset;
    var Q = S.quiz;
    switch (act) {
      case 'tab': stopLoop(); S.tab = D.t; S.msg = ''; S.delArm = null; S.edit = null; render(); window.scrollTo(0, 0); break;
      case 'amode': S.addMode = D.m; S.msg = ''; S.note = ''; render(); break;
      case 'lookup': lookup(); break;
      case 'save': saveFound(); break;
      case 'discard': S.found = null; S.note = ''; S.msg = ''; render(); break;
      case 'bulkgo': bulkLookup(); break;
      case 'bulksave': bulkSaveAll(); break;
      case 'sdrop': if (S.found) { S.found.senses.splice(Number(D.i), 1); render(); } break;
      case 'bdrop': S.bulk.results.splice(Number(D.i), 1); render(); break;
      case 'speak': playWord(D.t, D.a, D.l); break;
      case 'loop': toggleLoop(D.t, D.l, b); break;
      case 'toggle': S.open[D.id] = !S.open[D.id]; S.delArm = null; S.edit = null; render(); break;
      case 'edit': startEdit(D.id); break;
      case 'edsave': saveEdit(); break;
      case 'edcancel': S.edit = null; S.msg = ''; render(); break;
      case 'edsadd': collectEdit(); S.edit.draft.senses.push({ pos: '', koDef: '', en: '', ex: '', exKo: '' }); render(); break;
      case 'edsdrop': collectEdit(); S.edit.draft.senses.splice(Number(D.i), 1); render(); break;
      case 'kosave':
        var el = document.getElementById('ko-' + D.id);
        var w0 = S.words.find(function (x) { return x.id === D.id; });
        if (el && w0) { var nw = JSON.parse(JSON.stringify(w0)); nw.ko = el.value.trim(); putWord(nw); }
        break;
      case 'del':
        if (S.delArm === D.id) { S.delArm = null; if (S.edit && S.edit.id === D.id) S.edit = null; delWord(D.id); } else {
          S.delArm = D.id; render();
          var armId = D.id;
          setTimeout(function () { if (S.delArm === armId) { S.delArm = null; render(); } }, 4000);
        }
        break;
      case 'export': exportWords(); break;
      case 'krsave':
        var k1 = document.getElementById('kr-key'), k2 = document.getElementById('kr-base');
        S.krKey = k1 ? k1.value.trim() : '';
        S.krBase = k2 ? k2.value.trim() : '';
        try { localStorage.setItem(LS_KRKEY, S.krKey); localStorage.setItem(LS_KRBASE, S.krBase); } catch (err) {}
        S.msg = ''; S.note = S.krKey ? '한국어기초사전 설정을 저장했어요.' : '인증키를 지웠어요.';
        render(); break;
      case 'oxsave':
        S.oxId = (document.getElementById('ox-id') || { value: '' }).value.trim();
        S.oxKey = (document.getElementById('ox-key') || { value: '' }).value.trim();
        S.oxBase = (document.getElementById('ox-base') || { value: '' }).value.trim();
        try { localStorage.setItem(LS_OXID, S.oxId); localStorage.setItem(LS_OXKEY, S.oxKey); localStorage.setItem(LS_OXBASE, S.oxBase); } catch (err) {}
        S.msg = ''; S.note = 'Oxford 설정을 저장했어요.';
        render(); break;
      case 'mailsave':
        var m = document.getElementById('mail');
        S.email = m ? m.value.trim() : '';
        try { localStorage.setItem(LS_MAIL, S.email); } catch (err) {}
        S.note = S.email ? '이메일을 저장했어요.' : '이메일을 지웠어요.';
        render(); break;
      case 'qdate': Q.dates[D.d] = !Q.dates[D.d]; render(); break;
      case 'qall': S.words.forEach(function (w) { Q.dates[w.date] = true; }); render(); break;
      case 'qnone': Q.dates = {}; render(); break;
      case 'qwrong': Q.onlyWrong = !Q.onlyWrong; render(); break;
      case 'qmode': Q.mode = D.m; render(); break;
      case 'qstart':
        if (S.warp) break;
        beep('ok');
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { startRun(pool(), 1); break; }
        S.warp = true; render();
        setTimeout(function () { S.warp = false; startRun(pool(), 1); }, 1100);
        break;
      case 'snd':
        soundOn = !soundOn;
        try { localStorage.setItem('companyWords:snd', soundOn ? 'on' : 'off'); } catch (err) {}
        if (soundOn) beep('ok');
        render(); break;
      case 'pick': answerMC(Number(D.i)); break;
      case 'submit': answerType(); break;
      case 'hint': Q.run.hint = true; render(); break;
      case 'next': stopLoop(); nextQ(); break;
      case 'retry':
        var ids = Q.run.wrongIds;
        startRun(S.words.filter(function (w) { return ids.indexOf(w.id) >= 0; }), Q.run.round + 1);
        break;
      case 'qquit': stopLoop(); Q.run = null; render(); break;
    }
  });
  document.addEventListener('input', function (e) {
    var id = e.target && e.target.id;
    if (id === 'q') S.q = e.target.value;
    else if (id === 'bulk') S.bulkText = e.target.value;
    else if (id === 'foundKo') S.foundKo = e.target.value;
    else if (id === 'foundEn') S.foundEn = e.target.value;
  });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'imp' && e.target.files && e.target.files[0]) importWords(e.target.files[0]);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (e.target && e.target.id === 'q') { S.q = e.target.value; lookup(); }
    if (e.target && e.target.id === 'ans') answerType();
  });

  S.words = lsLoad();
  try { S.email = localStorage.getItem(LS_MAIL) || ''; var savedKey = localStorage.getItem(LS_KRKEY); S.krKey = savedKey === null ? KR_KEY_BUILTIN : savedKey; S.krBase = localStorage.getItem(LS_KRBASE) || '';
    var o1 = localStorage.getItem(LS_OXID), o2 = localStorage.getItem(LS_OXKEY);
    S.oxId = o1 === null ? OX_ID_BUILTIN : o1; S.oxKey = o2 === null ? OX_KEY_BUILTIN : o2; S.oxBase = localStorage.getItem(LS_OXBASE) || ''; } catch (e) {}
  var dc = document.getElementById('decor');
  if (dc) dc.innerHTML = '<div class="planet"></div><div class="ship">' + SHIP_SVG + '</div><div class="drone">' + robotSVG('idle') + '</div>';
  render();
})();

</script>
</body>
</html>
