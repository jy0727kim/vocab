<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="회사 단어장">
<title>회사 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F2F5F6; --card:#FFFFFF; --ink:#14262B; --mute:#5B6E73; --line:#D3DDE0;
  --acc:#0E6B73; --acc-ink:#FFFFFF; --accbg:#E1F0F1;
  --ok:#1F7A46; --okbg:#E3F3EA; --bad:#B8400E; --badbg:#FBE9E0;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --serif:'Noto Serif KR','Batang','AppleMyungjo',Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0F1A1D; --card:#172529; --ink:#E6EEF0; --mute:#93A8AD; --line:#2B3E43;
    --acc:#4FB7BF; --acc-ink:#0A1C1F; --accbg:#183338;
    --ok:#5CC48A; --okbg:#173326; --bad:#F08A5A; --badbg:#3A2218;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F1A1D; --card:#172529; --ink:#E6EEF0; --mute:#93A8AD; --line:#2B3E43;
  --acc:#4FB7BF; --acc-ink:#0A1C1F; --accbg:#183338;
  --ok:#5CC48A; --okbg:#173326; --bad:#F08A5A; --badbg:#3A2218;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding-bottom:84px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px}
header h1{font-family:var(--serif);font-size:26px;margin:0;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap-r{flex-wrap:wrap}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{display:block;width:100%;min-height:130px;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.modes{display:flex;gap:8px;margin-top:14px}
.modes button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px;font-weight:500}
.modes button[aria-pressed="true"]{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.brow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.brow .bi{flex:1;min-width:0}
.brow .bw{font-family:var(--serif);font-weight:700;font-size:18px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:500}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.mute{color:var(--mute)}
.small{font-size:13px}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--badbg);color:var(--bad);font-size:14px}
.note{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accbg);color:var(--ink);font-size:14px}

/* 사전 항목 */
.entry .hw{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.entry .word{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.entry .ipa{color:var(--mute);font-size:15px}
.spk{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;padding:0;flex:none}
.spk svg{width:18px;height:18px;fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spk.sm{width:30px;height:30px}.spk.sm svg{width:15px;height:15px}
.sense{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.sense:first-of-type{margin-top:12px}
.pos{display:inline-block;font-size:12px;font-weight:600;color:var(--acc);background:var(--accbg);border-radius:6px;padding:1px 8px;margin-right:6px}
.ko{font-weight:600;font-size:16px}
.en{margin:4px 0 0;color:var(--ink)}
.ex{margin:8px 0 0;padding-left:12px;border-left:3px solid var(--line)}
.ex .e{display:flex;gap:6px;align-items:flex-start;font-style:italic}
.ex .k{color:var(--mute);font-size:14px;margin-top:2px}

/* 단어장 목록 */
.group{margin-top:22px}
.group h3{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--mute);display:flex;justify-content:space-between}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.item>button.head{all:unset;box-sizing:border-box;display:flex;width:100%;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.item>button.head:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.item .iw{font-family:var(--serif);font-weight:700;font-size:18px}
.item .im{color:var(--mute);font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;background:var(--badbg);color:var(--bad);flex:none}
.item .detail{padding:0 14px 14px;border-top:1px solid var(--line)}
.item .detail .entry .sense:first-of-type{margin-top:6px;border-top:none;padding-top:0}
.danger{color:var(--bad);border-color:var(--bad)}

/* 퀴즈 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;text-align:left}
.seg button[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg);box-shadow:inset 0 0 0 1px var(--acc)}
.seg b{display:block;font-size:14px}
.seg span{font-size:12px;color:var(--mute)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--acc)}
.q-word{font-family:var(--serif);font-size:34px;font-weight:700;margin:6px 0 0}
.q-ko{font-size:20px;font-weight:600;margin:6px 0}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;text-align:left;font-size:15px}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.verdict{margin-top:14px;padding:10px 12px;border-radius:10px;font-weight:600}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.no{background:var(--badbg);color:var(--bad)}
.score{display:flex;gap:10px;margin-top:12px}
.score div{flex:1;border-radius:12px;padding:12px;text-align:center}
.score .r{background:var(--okbg);color:var(--ok)}
.score .w{background:var(--badbg);color:var(--bad)}
.score b{display:block;font-size:30px;font-family:var(--serif);line-height:1.1}
.rl{list-style:none;margin:8px 0 0;padding:0}
.rl li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rl li b{font-family:var(--serif);min-width:90px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;border:0;background:none;padding:12px 0 10px;font-size:14px;color:var(--mute);font-weight:500}
nav.tabs button[aria-current="page"]{color:var(--acc);font-weight:600;box-shadow:inset 0 3px 0 var(--acc)}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.dots::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:d 1.2s steps(4,end) infinite}
@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@media (prefers-reduced-motion: reduce){.dots::after{animation:none;content:'…'}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script>
(function () {
  'use strict';

  /* ---------- 작은 도구들 ---------- */
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmtDate(s) {
    var d = new Date(s + 'T00:00:00');
    if (isNaN(d)) return s;
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + '일월화수목금토'[d.getDay()] + ')';
  }
  function wordId(w) {
    var s = String(w).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    return s || ('w' + Date.now());
  }
  var ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  var HANGUL = /[가-힣]/;

  /* ---------- 상태 ---------- */
  var S = {
    tab: 'add', words: [], q: '', loading: false, found: null, foundKo: '',
    msg: '', note: '', addMode: 'one', bulkText: '',
    bulk: { loading: false, prog: '', results: [], bad: [], skipped: 0 },
    open: {}, delArm: null, email: '', storageOK: true,
    quiz: { dates: {}, onlyWrong: false, mode: 'mc', run: null }
  };

  /* ---------- 저장 (이 기기의 브라우저에 저장) ---------- */
  var LS_KEY = 'companyWords:v2';
  var LS_MAIL = 'companyWords:mail';
  function lsLoad() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { S.storageOK = false; return []; }
  }
  function lsSave() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(S.words)); } catch (e) { S.storageOK = false; }
  }
  function putWord(w, silent) {
    var i = S.words.findIndex(function (x) { return x.id === w.id; });
    if (i >= 0) S.words[i] = w; else S.words.push(w);
    lsSave();
    if (!silent) render();
  }
  function delWord(id) {
    S.words = S.words.filter(function (x) { return x.id !== id; });
    lsSave(); render();
  }

  /* ---------- 발음 ---------- */
  var canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  function speak(text) {
    if (!canSpeak || !text) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.9;
      var v = speechSynthesis.getVoices().find(function (x) { return /^en[-_]US$/i.test(x.lang); });
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) { /* 소리가 안 나도 앱은 계속 */ }
  }
  if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }
  function playWord(text, audio) {
    if (audio) {
      try {
        var a = new Audio(audio);
        a.play().catch(function () { speak(text); });
        return;
      } catch (e) { /* 아래 기본값 */ }
    }
    speak(text);
  }
  function spkBtn(text, small, audio) {
    return '<button class="spk' + (small ? ' sm' : '') + '" data-act="speak" data-t="' + esc(text) + '" data-a="' + esc(audio || '') +
      '" aria-label="미국식 발음 듣기">' + ICON + '</button>';
  }

  /* ---------- 무료 API 호출 ---------- */
  var DICT = 'https://api.dictionaryapi.dev/api/v2/entries/en/';
  var WIKT = 'https://en.wiktionary.org/api/rest_v1/page/definition/';
  var MM = 'https://api.mymemory.translated.net/get?langpair=en%7Cko&q=';

  async function fetchJson(url, ms) {
    var ctl = new AbortController();
    var t = setTimeout(function () { ctl.abort(); }, ms || 12000);
    try {
      var r = await fetch(url, { signal: ctl.signal });
      var data = null;
      try { data = await r.json(); } catch (e) { /* JSON이 아니어도 status는 쓴다 */ }
      return { status: r.status, data: data };
    } finally { clearTimeout(t); }
  }

  var POS_KO = { noun: '명', verb: '동', adjective: '형', adverb: '부', preposition: '전', conjunction: '접', pronoun: '대', interjection: '감', abbreviation: '약' };

  function pickSenses(all) {
    var picks = [];
    function add(s) { if (s && picks.indexOf(s) < 0 && picks.length < 3) picks.push(s); }
    var seenPos = {};
    all.forEach(function (s) {          // 1) 품사마다 하나씩 (예문 있는 걸 우선)
      if (seenPos[s.pos]) return;
      seenPos[s.pos] = 1;
      add(all.find(function (x) { return x.pos === s.pos && x.ex; }) || s);
    });
    all.forEach(function (s) { if (s.ex) add(s); });   // 2) 예문 있는 뜻으로 채우기
    all.forEach(function (s) { add(s); });             // 3) 그래도 모자라면 나머지
    return picks;
  }

  function stripHtml(x) {
    try {
      return (new DOMParser().parseFromString(String(x || ''), 'text/html').body.textContent || '').replace(/\s+/g, ' ').trim();
    } catch (e) { return String(x || '').replace(/<[^>]*>/g, '').trim(); }
  }
  var WIKT_SKIP = /^(plural|third-person|present participle|simple past|past participle|alternative|obsolete|misspelling|inflection|comparative|superlative|archaic|eye dialect|nonstandard)\b/i;
  function parseWikt(data, term) {
    var arr = data && data.en;
    if (!Array.isArray(arr) || !arr.length) return null;
    var all = [];
    arr.forEach(function (m) {
      (m.definitions || []).forEach(function (d) {
        var en = stripHtml(d.definition);
        if (!en) return;
        var ex = '';
        if (d.parsedExamples && d.parsedExamples[0] && d.parsedExamples[0].example) ex = stripHtml(d.parsedExamples[0].example);
        else if (d.examples && d.examples[0]) ex = stripHtml(d.examples[0]);
        var pos = String(m.partOfSpeech || '');
        all.push({ pos: POS_KO[pos.toLowerCase()] || pos, en: en, ex: ex });
      });
    });
    var good = all.filter(function (s) { return !WIKT_SKIP.test(s.en); });
    var picks = pickSenses(good.length ? good : all);
    if (!picks.length) return null;
    return {
      word: term, ipa: '', audio: '', ko: '',
      senses: picks.map(function (s) { return { pos: s.pos, en: s.en, ex: s.ex, koDef: '' }; }),
      manual: false, source: 'wikt'
    };
  }

  function parseDict(arr, w) {
    var e0 = arr[0] || {};
    var ph = [];
    arr.forEach(function (a) { (a.phonetics || []).forEach(function (p) { ph.push(p); }); });
    var us = ph.find(function (p) { return p.audio && /-us\./i.test(p.audio); });
    var withText = ph.find(function (p) { return p.text; });
    var all = [];
    arr.forEach(function (a) {
      (a.meanings || []).forEach(function (m) {
        (m.definitions || []).forEach(function (d) {
          all.push({ pos: POS_KO[m.partOfSpeech] || m.partOfSpeech || '', en: d.definition || '', ex: d.example || '' });
        });
      });
    });
    var picks = pickSenses(all);
    return {
      word: e0.word || w,
      ipa: (us && us.text) || (withText && withText.text) || e0.phonetic || '',
      audio: (us && us.audio) || '',
      ko: '',
      senses: picks.map(function (s) { return { pos: s.pos, en: s.en, ex: s.ex, koDef: '' }; }),
      manual: false
    };
  }

  async function tr(text) {
    var url = MM + encodeURIComponent(text) + (S.email ? '&de=' + encodeURIComponent(S.email) : '');
    var r = await fetchJson(url);
    var d = r.data || {};
    var t = (d.responseData && d.responseData.translatedText) || '';
    if (r.status === 429 || String(d.responseStatus) === '429' || /MYMEMORY WARNING/i.test(t)) throw { quota: true };
    var matches = (d.matches || []).slice().sort(function (a, b) { return (b.match || 0) - (a.match || 0); })
      .map(function (m) { return m.translation; });
    return [t].concat(matches).filter(Boolean);
  }
  async function koShort(word) {
    var list = await tr(word);
    var out = [];
    list.forEach(function (x) {
      x = String(x).trim().replace(/[\s:;,.!?]+$/, '');
      if (HANGUL.test(x) && x.length <= 18 && out.indexOf(x) < 0 && out.length < 3) out.push(x);
    });
    return out.join(' / ');
  }

  /* ---------- 예문 보충: Tatoeba (사람이 쓴 예문 + 한국어 번역) ---------- */
  var TAT = 'https://tatoeba.org/eng/api_v0/search?from=eng&sort=relevance&to=kor&query=';
  function pickKo(s) {
    var out = '';
    (function walk(x) {
      if (!x || out) return;
      if (Array.isArray(x)) { x.forEach(walk); return; }
      if (typeof x === 'object') {
        if (x.lang === 'kor' && x.text) { out = String(x.text); return; }
        if (x.translations) walk(x.translations);
      }
    })(s && s.translations);
    return out;
  }
  async function tatoebaSearch(q, koOnly) {
    var url = TAT + encodeURIComponent(q) + (koOnly ? '&trans_filter=limit&trans_link=direct&trans_to=kor' : '');
    var r = await fetchJson(url, 7000);
    var res = r.data && r.data.results;
    if (!Array.isArray(res)) return [];
    return res.map(function (s) { return { en: String((s && s.text) || ''), ko: pickKo(s) }; })
      .filter(function (x) { return x.en.length >= 15 && x.en.length <= 120; });
  }
  async function fillExamples(entry) {
    var term = entry.word;
    var q = term.indexOf(' ') >= 0 ? '"' + term + '"' : '=' + term;
    var list = await tatoebaSearch(q, true);
    if (list.length < 3) list = list.concat(await tatoebaSearch(q, false));
    var seen = {}, uniq = [];
    list.forEach(function (x) { if (!seen[x.en]) { seen[x.en] = 1; uniq.push(x); } });
    uniq.sort(function (a, b) { return (b.ko ? 1 : 0) - (a.ko ? 1 : 0) || a.en.length - b.en.length; });
    var i = 0;
    entry.senses.forEach(function (s) {
      if (!s.ex && uniq[i]) { s.ex = uniq[i].en; s.exKo = uniq[i].ko || ''; i++; }
    });
    entry.exSource = i ? 'tatoeba' : '';
  }

  async function buildEntry(w) {
    var r = null, freeDown = false, entry = null;
    try { r = await fetchJson(DICT + encodeURIComponent(w), 7000); } catch (e) { freeDown = true; }
    if (r && r.status >= 500) freeDown = true;
    if (!freeDown && r && r.status === 200 && Array.isArray(r.data) && r.data.length) {
      entry = parseDict(r.data, w);
      entry.source = 'free';
    }
    var wiktDown = false;
    if (!entry) {                       // 무료 사전이 안 되거나 단어가 없으면 Wiktionary로 한 번 더
      var terms = [w];
      if (w.toLowerCase() !== w) terms.push(w.toLowerCase());
      for (var k = 0; k < terms.length && !entry; k++) {
        try {
          var wk = await fetchJson(WIKT + encodeURIComponent(terms[k]), 8000);
          if (wk.status === 200) entry = parseWikt(wk.data, terms[k]);
          else if (wk.status !== 404) wiktDown = true;
        } catch (e) { wiktDown = true; }
      }
    }
    var dictDown = false;
    if (!entry) {
      entry = { word: w, ipa: '', audio: '', ko: '', senses: [], manual: true };
      dictDown = freeDown && wiktDown;  // 둘 다 연결이 안 될 때만 "서버 문제"로 본다
    }
    entry.quota = false;
    entry.dictDown = dictDown;
    if (!entry.manual && entry.senses.some(function (s) { return !s.ex; })) {
      try { await fillExamples(entry); } catch (e) { /* 예문을 못 가져와도 계속 */ }
    }
    try {
      entry.ko = await koShort(entry.word);
      for (var i = 0; i < entry.senses.length; i++) {
        var s = entry.senses[i];
        await sleep(200);
        var src = /^to\s+/i.test(s.en) ? s.en.replace(/^to\s+/i, '') : s.en;
        var t = (await tr(src))[0] || '';
        s.koDef = HANGUL.test(t) ? t : '';
      }
    } catch (e) {
      if (e && e.quota) entry.quota = true;
    }
    return entry;
  }
  var NET_ERR = '인터넷 연결이나 사전 서버 상태를 확인해 주세요. 잠시 뒤에 다시 시도하면 돼요.';
  var QUOTA_MSG = '무료 번역 한도에 닿아서 한글 뜻을 못 가져왔어요. 직접 적거나 내일 다시 시도해 주세요. (아래 “번역 한도 늘리기”도 참고)';

  /* ---------- 한 개 찾기 ---------- */
  async function lookup() {
    var w = S.q.trim();
    if (!w || S.loading) return;
    S.loading = true; S.found = null; S.foundKo = ''; S.msg = ''; S.note = '';
    render();

      if (e.dictDown) S.note = '사전 서버 두 곳 모두 연결되지 않아 영영 뜻과 예문은 못 가져왔어요. 한글 뜻만 확인해서 저장하거나, 나중에 다시 찾아보세요.';
      else if (e.source === 'wikt') S.note = 'Free Dictionary 대신 Wiktionary에서 가져왔어요. 발음기호는 없고, 🔊는 기기 음성으로 읽어줘요.';
      else if (e.manual) S.note = '사전에 없는 단어예요. 한글 뜻을 직접 적어서 저장할 수 있어요.' + (e.ko ? ' (자동 번역을 넣어뒀으니 확인해 주세요)' : '');
      if (e.exSource) S.note = (S.note ? S.note + ' ' : '') + '예문은 Tatoeba에서 가져왔어요. 위 뜻과 정확히 짝지어진 건 아니고 쓰임을 보여주는 예시예요.';
      if (e.quota) S.msg = QUOTA_MSG;
      var ex = S.words.find(function (x) { return x.id === wordId(e.word); });
      if (ex) S.note = '이미 ' + fmtDate(ex.date) + '에 저장한 단어예요.';

  /* ---------- 여러 개 한꺼번에 찾기 ---------- */
  async function bulkLookup() {
    var B = S.bulk;
    if (B.loading) return;
    var raw = S.bulkText.split(/[\n,;\t]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    var seen = {}, list = [], skipped = 0;
    raw.forEach(function (w) {
      var k = w.toLowerCase();
      if (seen[k]) return;
      seen[k] = 1;
      var id = wordId(w);
      if (S.words.some(function (x) { return x.id === id; }) || B.results.some(function (r) { return r.id === id; })) { skipped++; return; }
      list.push(w);
    });
    S.msg = ''; S.note = '';
    if (!list.length) {
      S.msg = raw.length ? '새로 찾을 단어가 없어요. 이미 저장했거나 같은 단어예요.' : '단어를 한 줄에 하나씩, 또는 쉼표로 구분해 넣어주세요.';
      render(); return;
    }
    if (list.length > 20) { list = list.slice(0, 20); S.note = '무료 번역 한도 때문에 한 번에 20개까지만 찾아요.'; }
    B.loading = true; B.bad = []; B.skipped = skipped;
    var total = list.length;
    B.prog = '0 / ' + total;
    render();
    var quotaHit = false;
    for (var i = 0; i < list.length; i++) {
      var w = list[i];
      try {
        var e = await buildEntry(w);
        if (e.dictDown) {
          B.bad = B.bad.concat(list.slice(i));
          S.msg = '사전 서버가 응답하지 않아요. 잠시 뒤에 다시 시도해 주세요.';
          break;
        }
        var id = wordId(e.word);
        if (e.manual || B.results.some(function (r) { return r.id === id; }) || S.words.some(function (x) { return x.id === id; })) {
          B.bad.push(w);
        } else {
          e.id = id; B.results.push(e);
        }
        if (e.quota) quotaHit = true;
      } catch (err) {
        B.bad.push(w);
      }
      B.prog = (i + 1) + ' / ' + total;
      render();
      await sleep(300);
    }
    B.loading = false;
    if (quotaHit) S.msg = QUOTA_MSG;
    render();
  }
  function bulkSaveAll() {
    var B = S.bulk, n = 0;
    B.results.forEach(function (e) {
      if (S.words.some(function (x) { return x.id === e.id; })) return;
      putWord({
        id: e.id, word: e.word, ipa: e.ipa, audio: e.audio, ko: e.ko, senses: e.senses, manual: false,
        date: today(), createdAt: Date.now() + n, wrong: false, right: 0, miss: 0
      }, true);
      n++;
    });
    var bad = B.bad.slice();
    S.bulk = { loading: false, prog: '', results: [], bad: [], skipped: 0 };
    S.bulkText = bad.join('\n');
    S.note = n + '개를 오늘 날짜로 저장했어요.' + (bad.length ? ' 사전에서 못 찾은 ' + bad.length + '개는 입력칸에 남겼어요. “한 개씩”에서 뜻을 직접 적어 저장할 수 있어요.' : '');
    render();
  }

    return S.words.filter(function (w) {
      if (Q.onlyWrong && !w.wrong) return false;
      if (sel.length) return sel.indexOf(w.date) >= 0;
      return Q.onlyWrong;
    });
  }

    var Q = S.quiz;

    S.words.forEach(function (w) { counts[w.date] = (counts[w.date] || 0) + 1; });
    var dates = Object.keys(counts).sort().reverse();

    h += '<div class="card"><h2>문제 방식</h2><div class="seg">' +

  function startRun(words, round) {
    var run = { items: shuffle(words), i: 0, mode: S.quiz.mode, round: round || 1, answered: null, hint: false, rightIds: [], wrongIds: [], done: false, q: null };
    S.quiz.run = run;
    buildQ(run);
    render();
  }
  function buildQ(run) {
    var w = run.items[run.i];
    run.answered = null; run.hint = false; run.q = null;
    if (run.mode === 'mc') {
      var correct = meaning(w);
      var seen = {}; seen[correct] = 1;
      var d = [];
      shuffle(S.words.filter(function (x) { return x.id !== w.id; })).forEach(function (x) {
        var m = meaning(x);
        if (d.length < 3 && !seen[m]) { seen[m] = 1; d.push(m); }
      });
      var opts = shuffle([correct].concat(d));
      run.q = { opts: opts, correct: opts.indexOf(correct) };
    }
  }
  function record(w, ok) {
    var nw = JSON.parse(JSON.stringify(w));
    if (ok) { nw.right = (nw.right || 0) + 1; nw.wrong = false; }
    else { nw.miss = (nw.miss || 0) + 1; nw.wrong = true; }
    putWord(nw, true);
    var run = S.quiz.run;
    run.items[run.i] = nw;
    (ok ? run.rightIds : run.wrongIds).push(nw.id);
  }
  function answerMC(idx) {
    var run = S.quiz.run;
    if (run.answered) return;
    var ok = idx === run.q.correct;
    run.answered = { ok: ok, pick: idx };
    record(run.items[run.i], ok);
    render();
  }
  function answerType() {
    var run = S.quiz.run;
    if (run.answered) return;
    var el = $('#ans');
    var v = el ? el.value.trim().toLowerCase() : '';
    if (!v) return;
    var w = run.items[run.i];
    var ok = v === String(w.word).trim().toLowerCase();
    run.answered = { ok: ok, text: el.value.trim() };
    record(w, ok);
    render();
  }
  function nextQ() {
    var run = S.quiz.run;
    if (run.i + 1 >= run.items.length) { run.done = true; render(); return; }
    run.i++;
    buildQ(run);
    render();
  }
  function viewQuizRun() {
    var run = S.quiz.run;
    if (run.done) return viewResult();
    var w = run.items[run.i];
    var total = run.items.length;
    var pct = Math.round((run.i + (run.answered ? 1 : 0)) / total * 100);
    var h = '<div class="card"><div class="row" style="justify-content:space-between"><span class="small mute">' +
      (run.round > 1 ? run.round + '번째 라운드 · ' : '') + (run.i + 1) + ' / ' + total + '</span>' +
      '<button class="btn small" data-act="qquit">그만두기</button></div>' +
      '<div class="prog"><i style="width:' + pct + '%"></i></div>';
    if (run.mode === 'mc') {
      h += '<div class="row" style="margin-top:10px"><p class="q-word" style="margin:0">' + esc(w.word) + '</p>' + spkBtn(w.word, false, w.audio) + '</div>' +
        (w.ipa ? '<div class="mute">' + esc(w.ipa) + '</div>' : '') + '<div class="opts">';
      run.q.opts.forEach(function (o, i) {
        var cls = 'opt';
        if (run.answered) {
          if (i === run.q.correct) cls += ' right';
          else if (i === run.answered.pick) cls += ' wrong';
        }
        h += '<button class="' + cls + '" data-act="pick" data-i="' + i + '"' + (run.answered ? ' disabled' : '') + '>' + esc(o) + '</button>';
      });
      h += '</div>';
    } else {
      h += '<p class="q-ko">' + esc(meaning(w)) + '</p>' +
        (w.senses[0] ? '<p class="en mute" style="margin:0">' + esc(w.senses[0].en) + '</p>' : '');
      if (run.hint && !run.answered) {
        h += '<p class="small" style="margin:10px 0 0">힌트: <b>' + esc(w.word.charAt(0)) + '</b>' + ' _'.repeat(Math.max(w.word.length - 1, 0)) + ' (' + w.word.length + '글자)</p>';
      }
      if (!run.answered) {
        h += '<div class="row" style="margin-top:14px"><input type="text" id="ans" placeholder="영어 단어를 입력" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="정답 입력">' +
          '<button class="btn pri" data-act="submit">확인</button></div>' +
          '<div style="margin-top:8px"><button class="btn small" data-act="hint">힌트 보기</button></div>';
      }
    }
    if (run.answered) {
      var a = run.answered;
      h += '<div class="verdict ' + (a.ok ? 'ok' : 'no') + '">' + (a.ok ? '정답이에요' : (run.mode === 'type' ? '아쉬워요. 정답은 ' + esc(w.word) : '아쉬워요. 초록색이 정답이에요')) +
        (run.mode === 'type' && !a.ok && a.text ? ' <span class="small" style="font-weight:400">(내 답: ' + esc(a.text) + ')</span>' : '') + '</div>' +
        '<div style="margin-top:12px">' + entryHTML(w) + '</div>' +
        '<button class="btn pri block" style="margin-top:16px" data-act="next">' + (run.i + 1 >= total ? '결과 보기' : '다음 문제') + '</button>';
    }
    return h + '</div>';
  }
  function viewResult() {
    var run = S.quiz.run;
    function find(id) { return S.words.find(function (x) { return x.id === id; }); }
    var wrongWords = run.wrongIds.map(find).filter(Boolean);
    var rightWords = run.rightIds.map(find).filter(Boolean);
    function li(w) { return '<li><b>' + esc(w.word) + '</b><span>' + esc(meaning(w)) + '</span></li>'; }
    var h = '<div class="card"><h2>' + (run.round > 1 ? run.round + '번째 라운드 결과' : '결과') + '</h2><div class="score">' +
      '<div class="r"><b>' + rightWords.length + '</b>맞힘</div><div class="w"><b>' + wrongWords.length + '</b>틀림</div></div>';
    if (wrongWords.length) h += '<h2 style="margin-top:18px">틀린 단어</h2><ul class="rl">' + wrongWords.map(li).join('') + '</ul>';
    else h += '<div class="note">이번 라운드는 전부 맞혔어요. 오답 노트에서도 모두 빠졌어요.</div>';
    if (rightWords.length) h += '<h2 style="margin-top:18px">맞힌 단어</h2><ul class="rl">' + rightWords.map(li).join('') + '</ul>';
    h += '<div style="margin-top:18px;display:grid;gap:8px">' +
      (wrongWords.length ? '<button class="btn pri block" data-act="retry">틀린 ' + wrongWords.length + '개만 다시 풀기</button>' : '') +
      '<button class="btn block" data-act="qquit">퀴즈 설정으로 돌아가기</button></div></div>';
    return h;
  }

  /* ---------- 전체 그리기 ---------- */
  function render() {
    var body;
    if (S.tab === 'add') body = viewAdd();
    else if (S.tab === 'list') body = viewList();
    else body = S.quiz.run ? viewQuizRun() : viewQuizSetup();
    $('#app').innerHTML = '<header><h1>회사 단어장</h1><p>이 기기에 저장 중 · 무료 사전 API 사용</p></header>' + body +
      (S.msg && S.tab === 'list' ? '<div class="msg" role="alert">' + esc(S.msg) + '</div>' : '');
    var tabs = [['add', '추가'], ['list', '단어장 ' + S.words.length], ['quiz', '퀴즈']];
    $('#tabs').innerHTML = tabs.map(function (t) {
      return '<button data-act="tab" data-t="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : '') + '>' + esc(t[1]) + '</button>';
    }).join('');
    if (S.tab === 'quiz' && S.quiz.run && !S.quiz.run.done && S.quiz.run.mode === 'type' && !S.quiz.run.answered) {
      setTimeout(function () { var el = $('#ans'); if (el) el.focus(); }, 30);
    }
  }

  /* ---------- 백업 ---------- */
  function exportWords() {
    try {
      var blob = new Blob([JSON.stringify(S.words, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'company-words-' + today() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    } catch (e) { S.msg = '내보내기에 실패했어요.'; render(); }
  }
  function importWords(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var arr = JSON.parse(fr.result);
        if (!Array.isArray(arr)) throw new Error('bad');
        var n = 0;
        arr.forEach(function (w) {
          if (!w || !w.id || !w.word || !Array.isArray(w.senses)) return;
          if (S.words.some(function (x) { return x.id === w.id; })) return;
          putWord(w, true); n++;
        });
        S.msg = ''; S.note = n + '개를 가져왔어요.';
      } catch (e) { S.msg = '파일을 읽지 못했어요. 이 앱에서 내보낸 .json 파일인지 확인해 주세요.'; }
      render();
    };
    fr.readAsText(file);
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var act = b.getAttribute('data-act');
    var D = b.dataset;
    var Q = S.quiz;
    switch (act) {
      case 'tab': S.tab = D.t; S.msg = ''; S.delArm = null; render(); window.scrollTo(0, 0); break;
      case 'amode': S.addMode = D.m; S.msg = ''; S.note = ''; render(); break;
      case 'lookup': lookup(); break;
      case 'save': saveFound(); break;
      case 'discard': S.found = null; S.note = ''; S.msg = ''; render(); break;
      case 'bulkgo': bulkLookup(); break;
      case 'bulksave': bulkSaveAll(); break;
      case 'bdrop': S.bulk.results.splice(Number(D.i), 1); render(); break;
      case 'speak': playWord(D.t, D.a); break;
      case 'toggle': S.open[D.id] = !S.open[D.id]; S.delArm = null; render(); break;
      case 'kosave':
        var el = document.getElementById('ko-' + D.id);
        var w0 = S.words.find(function (x) { return x.id === D.id; });
        if (el && w0) { var nw = JSON.parse(JSON.stringify(w0)); nw.ko = el.value.trim(); putWord(nw); }
        break;
      case 'del':
        if (S.delArm === D.id) { S.delArm = null; delWord(D.id); } else { S.delArm = D.id; render(); }
        break;
      case 'export': exportWords(); break;
      case 'mailsave':
        var m = document.getElementById('mail');
        S.email = m ? m.value.trim() : '';
        try { localStorage.setItem(LS_MAIL, S.email); } catch (err) {}
        S.note = S.email ? '이메일을 저장했어요.' : '이메일을 지웠어요.';
        render(); break;
      case 'qdate': Q.dates[D.d] = !Q.dates[D.d]; render(); break;
      case 'qall': S.words.forEach(function (w) { Q.dates[w.date] = true; }); render(); break;
      case 'qnone': Q.dates = {}; render(); break;
      case 'qwrong': Q.onlyWrong = !Q.onlyWrong; render(); break;
      case 'qmode': Q.mode = D.m; render(); break;
      case 'qstart': startRun(pool(), 1); break;
      case 'pick': answerMC(Number(D.i)); break;
      case 'submit': answerType(); break;
      case 'hint': Q.run.hint = true; render(); break;
      case 'next': nextQ(); break;
      case 'retry':
        var ids = Q.run.wrongIds;
        startRun(S.words.filter(function (w) { return ids.indexOf(w.id) >= 0; }), Q.run.round + 1);
        break;
      case 'qquit': Q.run = null; render(); break;
    }
  });
  document.addEventListener('input', function (e) {
    var id = e.target && e.target.id;
    if (id === 'q') S.q = e.target.value;
    else if (id === 'bulk') S.bulkText = e.target.value;
    else if (id === 'foundKo') S.foundKo = e.target.value;
  });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'imp' && e.target.files && e.target.files[0]) importWords(e.target.files[0]);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (e.target && e.target.id === 'q') { S.q = e.target.value; lookup(); }
    if (e.target && e.target.id === 'ans') answerType();
  });

  S.words = lsLoad();
  try { S.email = localStorage.getItem(LS_MAIL) || ''; } catch (e) {}
  render();
})();

</script>
</body>
</html>
